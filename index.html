<style>
:root{
  --primary:#1E3A75; --primary-2:#2F56B0; --primary-3:#4C7CE0; --primary-soft:#E4EAF9;
  --accent:#F5A623; --accent-soft:#FDECC8; --accent-deep:#C97F0A;
  --success:#16A34A; --success-soft:#DCFCE7;
  --danger:#DC2626; --danger-soft:#FEE2E2;
  --info:#0EA5E9; --info-soft:#E0F2FE;
  --violet:#7C5CD6; --violet-soft:#EBE4FA;
  --bg:#EEF1F7; --card:#FFFFFF; --line:#E3E8F0; --line-soft:#EEF1F7;
  --text:#1F2A44; --muted:#67748E;
  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(30,58,117,.06), 0 1px 1px rgba(30,58,117,.04);
  --shadow-lg:0 18px 40px rgba(20,32,64,.18);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif; color:var(--text); background:var(--bg);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Plus Jakarta Sans',sans-serif; margin:0; color:var(--primary); font-weight:700;}
p{margin:0;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit; font-size:14px;}
a{color:inherit;}
::selection{background:var(--accent-soft);}
:focus-visible{outline:2px solid var(--primary-3); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }

/* ---------- layout ---------- */
.app{display:flex; min-height:100vh;}
.sidebar{
  width:252px; flex:0 0 252px; background:var(--primary); color:#DCE3F5;
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{padding:20px 20px 16px; display:flex; align-items:center; gap:10px;}
.brand .mark{width:34px; height:34px; border-radius:9px; background:var(--primary-3); display:flex; align-items:center; justify-content:center; font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; color:#fff; font-size:16px; position:relative; flex:0 0 auto;}
.brand .mark::after{content:''; position:absolute; top:-3px; right:-3px; width:9px; height:9px; border-radius:50%; background:var(--accent); border:2px solid var(--primary);}
.brand-name{font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:18px; color:#fff; line-height:1.1;}
.brand-sub{font-size:10.5px; color:#9FADD1; margin-top:1px;}
.company-line{padding:0 20px 14px; font-size:11.5px; color:#8494C0; border-bottom:1px solid rgba(255,255,255,.1); padding-bottom:14px;}
.navgroups{padding:8px 12px 10px; flex:1;}
.navgroup{margin-bottom:2px;}
.navgroup-head{width:100%; display:flex; align-items:center; justify-content:space-between; background:none; border:none; color:#AEB9DA; font-size:11.5px; font-weight:700; padding:14px 10px 6px; cursor:pointer; letter-spacing:.2px;}
.navgroup-head .chev{transition:transform .15s; font-size:12px;}
.navgroup-head .chev.open{transform:rotate(180deg);}
ul.navlist{list-style:none; margin:0; padding:0; overflow:hidden; max-height:600px; transition:max-height .2s ease;}
ul.navlist.closed{max-height:0;}
ul.navlist li{margin-bottom:1px;}
ul.navlist button{
  width:100%; text-align:left; background:transparent; border:none; color:#C7D0EA;
  padding:9px 12px; border-radius:8px; font-size:13.3px; cursor:pointer; display:flex;
  align-items:center; gap:9px; font-weight:500;
}
ul.navlist button .ico{width:16px; text-align:center; opacity:.85; font-size:13px;}
ul.navlist button:hover{background:rgba(255,255,255,.07); color:#fff;}
ul.navlist button.active{background:var(--primary-3); color:#fff; font-weight:700; box-shadow:var(--shadow);}
.badge-nav{margin-left:auto; background:var(--accent); color:#3A2600; font-size:10px; font-weight:800; border-radius:20px; padding:1px 6px; min-width:16px; text-align:center;}
.sidebar-foot{padding:12px 20px 16px; font-size:10.5px; color:#7C8AB2; border-top:1px solid rgba(255,255,255,.08);}
.sidebar-foot button{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); color:#fff; font-size:11.5px; padding:7px 10px; border-radius:7px; cursor:pointer; width:100%; margin-top:8px; font-weight:600;}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:30; background:rgba(255,255,255,.9); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line); padding:12px 26px; display:flex; align-items:center; gap:16px;
}
.menu-toggle{display:none; background:none; border:1px solid var(--line); border-radius:8px; padding:7px 10px; cursor:pointer; font-size:15px;}
.search-wrap{position:relative; flex:1; max-width:380px;}
.search-wrap input{width:100%; padding:9px 12px 9px 34px; border:1px solid var(--line); border-radius:9px; background:var(--bg); font-size:13px;}
.search-wrap .sico{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:13px;}
.search-drop{position:absolute; top:calc(100% + 6px); left:0; right:0; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow-lg); max-height:280px; overflow-y:auto; z-index:40;}
.search-drop .row{padding:9px 12px; cursor:pointer; display:flex; align-items:center; gap:9px;}
.search-drop .row:hover{background:var(--bg);}
.topbar-spacer{flex:1;}
.topbar-icons{display:flex; align-items:center; gap:4px;}
.ticon{position:relative; background:none; border:none; width:36px; height:36px; border-radius:9px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; color:var(--primary);}
.ticon:hover{background:var(--bg);}
.ticon .dot{position:absolute; top:5px; right:5px; width:8px; height:8px; border-radius:50%; background:var(--danger); border:2px solid #fff;}
.install-btn{display:inline-flex; align-items:center; gap:6px; background:var(--accent); color:#3A2600; border:none; border-radius:9px; padding:8px 13px; font-size:12.5px; font-weight:700; cursor:pointer;}
.topbar-user{display:flex; align-items:center; gap:8px; padding:5px 10px 5px 5px; border-radius:20px; cursor:pointer; border:1px solid var(--line); background:#fff;}
.topbar-user:hover{background:var(--bg);}
.topbar-user .nm{font-size:12.5px; font-weight:600;}
.dropdown-panel{position:absolute; top:56px; right:26px; width:320px; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow-lg); z-index:50; overflow:hidden;}
.dropdown-panel .dp-head{padding:12px 16px; font-weight:700; border-bottom:1px solid var(--line); font-size:13px;}
.dropdown-panel .dp-body{max-height:340px; overflow-y:auto;}
.dp-item{padding:11px 16px; border-bottom:1px solid var(--line-soft); font-size:12.5px; cursor:pointer;}
.dp-item:hover{background:var(--bg);}
.dp-item .t{font-weight:600; color:var(--text);}
.dp-item .s{color:var(--muted); font-size:11.5px; margin-top:2px;}

.content{padding:24px 26px 60px; flex:1;}
.page-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:20px; gap:14px; flex-wrap:wrap;}
.page-head h1{font-size:22px;}
.page-head .subt{font-size:12.5px; color:var(--muted); margin-top:3px; font-weight:400; font-family:'Inter';}

/* ---------- basic elements ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}
.card-pad{padding:20px;}
.card-bar{background:linear-gradient(135deg,var(--primary),var(--primary-2)); color:#fff; padding:13px 20px; border-radius:var(--radius) var(--radius) 0 0; font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:14.5px; display:flex; align-items:center; justify-content:space-between;}
.section-title{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; gap:12px; flex-wrap:wrap;}
.section-title h2{font-size:16.5px;}
.section-title .hint{font-size:12.5px; color:var(--muted); font-family:'Inter'; font-weight:400;}

.grid{display:grid; gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:1100px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} }
@media (max-width:640px){ .grid-4,.grid-3,.grid-2{grid-template-columns:1fr;} }

.stat{padding:16px 18px; position:relative; overflow:hidden;}
.stat .lbl{font-size:12px; color:var(--muted); display:flex; justify-content:space-between; align-items:center;}
.stat .num{font-family:'Plus Jakarta Sans',sans-serif; font-size:26px; font-weight:800; margin-top:6px; color:var(--primary);}
.stat .sub{font-size:11.5px; color:var(--muted); margin-top:4px;}
.stat .icochip{width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:14px;}
.chip-blue{background:var(--primary-soft); color:var(--primary-2);}
.chip-amber{background:var(--accent-soft); color:var(--accent-deep);}
.chip-green{background:var(--success-soft); color:var(--success);}
.chip-red{background:var(--danger-soft); color:var(--danger);}
.chip-violet{background:var(--violet-soft); color:var(--violet);}
.chip-info{background:var(--info-soft); color:var(--info);}

.btn{
  display:inline-flex; align-items:center; gap:6px; padding:9px 15px; border-radius:9px; border:1px solid transparent;
  font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;
}
.btn-primary{background:var(--primary-2); color:#fff;}
.btn-primary:hover{background:var(--primary);}
.btn-accent{background:var(--accent); color:#3A2600;}
.btn-accent:hover{background:var(--accent-deep); color:#fff;}
.btn-ghost{background:transparent; border-color:var(--line); color:var(--text);}
.btn-ghost:hover{background:var(--bg);}
.btn-teal{background:var(--success); color:#fff;}
.btn-danger{background:transparent; border-color:var(--danger); color:var(--danger);}
.btn-danger:hover{background:var(--danger-soft);}
.btn-sm{padding:6px 11px; font-size:12px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.icon-btn{background:none; border:none; cursor:pointer; color:var(--muted); font-size:16px; line-height:1; padding:4px;}
.icon-btn:hover{color:var(--text);}

.field{margin-bottom:13px;}
.field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px; font-weight:500;}
.field input, .field select, .field textarea{
  width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--text);
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--primary-3);}
.field textarea{resize:vertical; min-height:70px;}
.field-row{display:flex; gap:12px;}
.field-row .field{flex:1;}
.check-row{display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:12px;}

table{width:100%; border-collapse:collapse; font-size:13px;}
thead th{
  text-align:left; font-size:11.5px; font-weight:700; color:var(--muted);
  padding:10px 12px; border-bottom:1px solid var(--line); background:var(--bg);
}
tbody td{padding:10px 12px; border-bottom:1px solid var(--line-soft); vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#FAFBFD;}
.table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:#fff;}
.num-cell{text-align:right; font-variant-numeric:tabular-nums;}
.tbl-input{width:60px; padding:5px 6px; border:1px solid var(--line); border-radius:6px; text-align:right; font-variant-numeric:tabular-nums;}

.pill{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:700;}
.pill-green{background:var(--success-soft); color:var(--success);}
.pill-amber{background:var(--accent-soft); color:var(--accent-deep);}
.pill-red{background:var(--danger-soft); color:var(--danger);}
.pill-blue{background:var(--primary-soft); color:var(--primary-2);}
.pill-gray{background:var(--line-soft); color:var(--muted);}
.pill-violet{background:var(--violet-soft); color:var(--violet);}

.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:18px; flex-wrap:wrap;}
.tabs button{background:none; border:none; padding:10px 15px; font-size:13px; color:var(--muted); cursor:pointer; border-bottom:2.5px solid transparent; margin-bottom:-1px; font-weight:600;}
.tabs button.active{color:var(--primary); border-bottom-color:var(--primary-2);}

.chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
.chip{border:1px solid var(--line); background:#fff; padding:6px 13px; border-radius:20px; font-size:12.5px; cursor:pointer; color:var(--muted); font-weight:500;}
.chip.active{background:var(--primary); color:#fff; border-color:var(--primary);}

.empty{padding:38px 20px; text-align:center; color:var(--muted);}
.empty .big{font-family:'Plus Jakarta Sans',sans-serif; font-size:16px; color:var(--primary); margin-bottom:6px; font-weight:700;}

/* hexagon avatars */
.hex{clip-path:polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0% 50%); background:var(--primary-3); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; flex:0 0 auto;}
.hex-sm{width:30px; height:30px; font-size:11px;}
.hex-md{width:44px; height:44px; font-size:14px;}
.hex-lg{width:88px; height:88px; font-size:26px;}
.hex-wrap{position:relative; display:inline-block;}
.hex-ring{padding:3px; background:var(--primary-soft); clip-path:polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0% 50%);}

.person{display:flex; align-items:center; gap:10px;}
.person .nm{font-weight:600; font-size:13px;}
.person .sub{font-size:11.5px; color:var(--muted);}

/* modal */
.modal-overlay{position:fixed; inset:0; background:rgba(15,23,50,.5); display:flex; align-items:flex-start; justify-content:center; padding:5vh 20px; z-index:100; overflow-y:auto;}
.modal{background:#fff; border-radius:14px; width:100%; max-width:560px; box-shadow:var(--shadow-lg);}
.modal.wide{max-width:780px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--line);}
.modal-head h3{font-size:16.5px;}
.modal-body{padding:20px; max-height:70vh; overflow-y:auto;}
.modal-foot{padding:14px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px;}

/* toast */
#toastRoot{position:fixed; bottom:22px; right:22px; z-index:200; display:flex; flex-direction:column; gap:8px;}
.toast{background:var(--primary); color:#fff; padding:11px 18px; border-radius:9px; font-size:13px; opacity:0; transform:translateY(8px); transition:opacity .25s, transform .25s; box-shadow:var(--shadow-lg);}
.toast.show{opacity:1; transform:translateY(0);}

/* comm center */
.comm-layout{display:grid; grid-template-columns:320px 1fr; gap:0; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:#fff; min-height:520px;}
.comm-list{border-right:1px solid var(--line); overflow-y:auto; max-height:640px;}
.comm-item{padding:12px 16px; border-bottom:1px solid var(--line-soft); cursor:pointer;}
.comm-item:hover{background:#FAFBFD;}
.comm-item.active{background:var(--primary-soft);}
.comm-item .top{display:flex; justify-content:space-between; gap:8px;}
.comm-item .nm{font-weight:700; font-size:13px;}
.comm-item .ch{font-size:10.5px; color:var(--muted);}
.comm-item .snip{font-size:12px; color:var(--muted); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.comm-item .unread{width:7px; height:7px; border-radius:50%; background:var(--accent); display:inline-block; margin-left:6px;}
.comm-thread{display:flex; flex-direction:column; height:100%;}
.comm-thread-head{padding:14px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
.comm-msgs{flex:1; padding:18px 20px; overflow-y:auto; max-height:460px; display:flex; flex-direction:column; gap:10px;}
.msg{max-width:70%; padding:9px 13px; border-radius:12px; font-size:13px;}
.msg.them{background:var(--line-soft); align-self:flex-start;}
.msg.us{background:var(--primary-2); color:#fff; align-self:flex-end;}
.msg .hora{display:block; font-size:10px; margin-top:4px; opacity:.7;}
.comm-reply{border-top:1px solid var(--line); padding:12px 16px; display:flex; gap:8px;}
.comm-reply textarea{flex:1; resize:none; height:42px; border:1px solid var(--line); border-radius:8px; padding:9px;}
.acct-chip{display:flex; align-items:center; gap:7px; border:1px solid var(--line); border-radius:20px; padding:6px 12px; font-size:12px;}
.acct-chip .ok{width:7px; height:7px; border-radius:50%; background:var(--success);}

/* signature pad */
.sigpad{border:1.5px dashed var(--line); border-radius:10px; background:#FAFBFD; touch-action:none; cursor:crosshair;}

/* bars */
.bar-row{margin-bottom:10px;}
.bar-row .bl{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px;}
.bar-track{background:var(--line-soft); border-radius:5px; height:10px; overflow:hidden;}
.bar-fill{background:var(--primary-2); height:100%; border-radius:5px;}
.bar-fill.green{background:var(--success);}
.bar-fill.amber{background:var(--accent);}

/* recognition cards */
.recog-card{background:#fff; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);}
.recog-head{padding:11px 16px; font-weight:700; font-size:13px; color:#fff;}
.recog-body{padding:14px 16px;}
.recog-title{font-weight:700; font-size:13.5px; margin-bottom:8px;}
.recog-msg{font-size:12.5px; color:var(--muted); border-left:2px solid var(--line); padding-left:9px; margin-bottom:7px;}
.recog-foot{display:flex; gap:16px; padding:10px 16px; border-top:1px solid var(--line-soft); font-size:12.5px; color:var(--muted);}
.recog-foot span{display:flex; align-items:center; gap:5px; cursor:pointer;}

/* benefit cards */
.benefit-card{border-radius:var(--radius); overflow:hidden; color:#fff; position:relative; min-height:150px; display:flex; flex-direction:column; justify-content:flex-end; padding:16px; box-shadow:var(--shadow);}
.benefit-card .pts{position:absolute; top:10px; right:10px; background:rgba(255,255,255,.22); backdrop-filter:blur(4px); border-radius:20px; padding:4px 10px; font-size:11px; font-weight:700;}
.benefit-card .emoji{font-size:26px; margin-bottom:6px;}
.benefit-card h4{color:#fff; font-size:15px; margin-bottom:4px;}
.benefit-card p{font-size:11.5px; opacity:.92; margin-bottom:10px;}
.benefit-card button{align-self:flex-start; background:#fff; color:var(--primary); border:none; border-radius:8px; padding:7px 13px; font-size:12px; font-weight:700; cursor:pointer;}

/* points badge */
.points-badge{display:flex; align-items:center; gap:8px; background:var(--accent-soft); color:var(--accent-deep); border-radius:20px; padding:8px 16px; font-size:13px; font-weight:700;}

/* mobile */

/* seed attendance for the last 5 workdays for active employees */
(function seedAttendance(){
  const today = new Date(DEMO_TODAY+'T00:00:00');
  const activos = DB.empleados.filter(e=>e.estado==='Activo');
  for(let d=4; d>=0; d--){
    const day = new Date(today); day.setDate(day.getDate()-d);
    const iso = day.toISOString().slice(0,10);
    activos.forEach((e,idx)=>{
      const late = (idx+d)%5===0;
      const absent = (idx===7 && d===2);
      if(absent){
        DB.attendance.push({id:'att'+(DB.seq.att++), empId:e.id, fecha:iso, entrada:null, salida:null, estado:'Ausente'});
      } else {
        const hIn = late? '08:1'+(idx%9) : '07:5'+(idx%9);
        DB.attendance.push({id:'att'+(DB.seq.att++), empId:e.id, fecha:iso, entrada: d===0? null : hIn, salida: d===0? null : '17:0'+(idx%9), estado: late? 'Tarde':'A tiempo'});
      }
    });
  }
})();

/* =========================================================
   EXPORTACIÓN CSV (usado por Reportes y por varios módulos)
   ========================================================= */
function exportCSV(filename, headers, rows){
  const esc = v => `"${String(v??'').replace(/"/g,'""')}"`;
  const csv = [headers.map(esc).join(','), ...rows.map(r=>r.map(esc).join(','))].join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

/* =========================================================
   3. NÓMINA (+ liquidación detallada descargable)
   ========================================================= */
function calcularDetalle(det, e){
  const valorDia = e.salario/30;
  const valorHora = e.salario/CFG.horasMes;
  const salarioProp = valorDia * det.dias;
  const extraHED = valorHora * det.hed * (1+CFG.rHED/100);
  const extraHEN = valorHora * det.hen * (1+CFG.rHEN/100);
  const extraHEFD = valorHora * det.hefd * (1+CFG.rHEFD/100);
  const extraHEFN = valorHora * det.hefn * (1+CFG.rHEFN/100);
  const auxTr = (e.salario <= CFG.smmlv*2) ? CFG.auxTransporte * (det.dias/30) : 0;
  const devengado = salarioProp + extraHED + extraHEN + extraHEFD + extraHEFN + auxTr + det.bonif + det.otros;
  const salud = salarioProp * CFG.saludPct/100;
  const pension = salarioProp * CFG.pensionPct/100;
  const deducciones = salud + pension + det.otrasDed;
  det.salarioProp=Math.round(salarioProp); det.extraTotal=Math.round(extraHED+extraHEN+extraHEFD+extraHEFN);
  det.auxTr=Math.round(auxTr); det.devengado=Math.round(devengado); det.salud=Math.round(salud); det.pension=Math.round(pension);
  det.deducciones=Math.round(deducciones); det.neto=Math.round(devengado-deducciones);
  return det;
}

        </tr>`;

    </tbody>
  </table></div>
  <p style="margin-top:10px; font-size:12px; color:var(--muted);">Cálculo basado en los parámetros legales configurables: auxilio de transporte hasta 2 SMMLV, aportes de salud y pensión, y recargos de horas extra. Ajusta estos valores en <a style="color:var(--primary-2); cursor:pointer;" onclick="navigate('parametros')">Parámetros legales</a> cada vez que cambie la normativa vigente.</p>`;

function actualizarLinea(runId, empId, campo, valor){
  const run = DB.payrollRuns.find(r=>r.id===runId);
  const det = run.detalles.find(d=>d.empId===empId);
  det[campo] = Number(valor)||0;

  $(`#ded-${runId}-${empId}`).textContent = fmtCOP(det.deducciones);
  $(`#net-${runId}-${empId}`).innerHTML = `<strong>${fmtCOP(det.neto)}</strong>`;

function crearLiquidacion(){
  const periodo = $('#np_periodo').value.trim() || 'Nuevo periodo';
  const fechaPago = $('#np_fecha').value;
  const run = {id:uid('run'), periodo, fechaPago, estado:'Borrador', detalles:[]};
  DB.empleados.filter(e=>e.estado==='Activo').forEach(e=>{
    const det = {empId:e.id, dias:30, hed:0, hen:0, hefd:0, hefn:0, bonif:0, otros:0, otrasDed:0};
    calcularDetalle(det, e);
    run.detalles.push(det);
  });
  DB.payrollRuns.push(run); state.payrollOpenRun = run.id;
  closeModal(); toast('Liquidación generada'); renderApp();
}

function abrirFirma(docId){
  const d = DB.documents.find(x=>x.id===docId); const e = emp(d.empId);
  const body = `
    <p style="font-size:13px; margin-bottom:10px;"><strong>${d.nombre}</strong> · ${e.nombre}</p>
    <label style="display:block; font-size:12px; color:var(--muted); margin-bottom:6px;">Firma con el mouse o el dedo en el recuadro</label>
    <canvas id="sigCanvas" class="sigpad" width="500" height="160" style="width:100%; max-width:500px;"></canvas>
    <div style="margin-top:8px;"><button class="btn btn-ghost btn-sm" onclick="limpiarFirma()">Limpiar</button></div>`;
  const foot = `<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="confirmarFirma('${docId}')">Confirmar firma</button>`;
  openModal('Firma electrónica', body, foot);
  setTimeout(initSigPad, 30);
}
let sigCtx=null, sigDrawing=false, sigHasStroke=false;
function initSigPad(){
  const c = $('#sigCanvas'); if(!c) return;
  sigCtx = c.getContext('2d'); sigCtx.lineWidth=2; sigCtx.lineCap='round'; sigCtx.strokeStyle='#1E3A75'; sigHasStroke=false;
  const pos = ev=>{ const r=c.getBoundingClientRect(); const p = ev.touches? ev.touches[0]:ev;
    return {x:(p.clientX-r.left)*(c.width/r.width), y:(p.clientY-r.top)*(c.height/r.height)}; };
  const start = ev=>{ sigDrawing=true; sigHasStroke=true; const p=pos(ev); sigCtx.beginPath(); sigCtx.moveTo(p.x,p.y); ev.preventDefault(); };
  const move = ev=>{ if(!sigDrawing) return; const p=pos(ev); sigCtx.lineTo(p.x,p.y); sigCtx.stroke(); ev.preventDefault(); };
  const end = ()=>{ sigDrawing=false; };
  c.onmousedown=start; c.onmousemove=move; window.addEventListener('mouseup', end);
  c.ontouchstart=start; c.ontouchmove=move; c.ontouchend=end;
}
function limpiarFirma(){ const c=$('#sigCanvas'); sigCtx.clearRect(0,0,c.width,c.height); sigHasStroke=false; }
function confirmarFirma(docId){
  if(!sigHasStroke){ toast('Dibuja tu firma antes de confirmar'); return; }
  const d = DB.documents.find(x=>x.id===docId); const e = emp(d.empId);
  d.estado='Firmado'; d.firmante=e.nombre; d.firmaFecha=DEMO_TODAY;
  closeModal(); toast('Documento firmado electrónicamente'); renderApp();
}

  const d = DB.documents.find(x=>x.id===docId);

  `, `<button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>`);
}

    ${['todos','gmail','outlook','whatsapp'].map(c=>`<div class="chip ${state.commTab===c?'active':''}" onclick="state.commTab='${c}'; state.commThreadId=null; renderApp();">${c==='todos'?'Todos':canalLabel(c)}</div>`).join('')}

  <div class="comm-layout">

        <div class="snip">${t.asunto}</div>

    </div>

        <div class="comm-msgs" id="commMsgs">
          ${activeThread.mensajes.map(m=>`<div class="msg ${m.de==='ellos'?'them':'us'}">${m.texto}<span class="hora">${m.hora}</span></div>`).join('')}

function findThreadById(id){
  for(const canal of ['gmail','outlook','whatsapp']){ const t = DB.comm[canal].find(x=>x.id===id); if(t) return {t,canal}; }
  return null;
}
function abrirHilo(id){ const f=findThreadById(id); if(f) f.t.leido=true; state.commThreadId=id; renderApp(); }
function responderHilo(id){
  const f = findThreadById(id); if(!f) return;
  const txt = $('#commReply').value.trim(); if(!txt) return;
  const hora = new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
  f.t.mensajes.push({de:'nosotros', texto:txt, hora}); f.t.fecha = new Date().toISOString();
  renderApp(); toast('Mensaje enviado');
}

function abrirNuevaEncuesta(){ state.surveyTemp = {titulo:'', descripcion:'', preguntas:[]}; renderModalNuevaEncuesta(); }

      <div class="field" id="qn_opciones_wrap" style="display:none;"><label>Opciones (separadas por coma)</label><input id="qn_opciones" placeholder="Opción 1, Opción 2, Opción 3"></div>

function agregarPreguntaTemp(){
  const texto = $('#qn_texto').value.trim(); if(!texto){ toast('Escribe el texto de la pregunta'); return; }
  const tipo = $('#qn_tipo').value;
  const p = {id:'q'+(state.surveyTemp.preguntas.length+1), texto, tipo};
  if(tipo==='opcion'){ p.opciones = $('#qn_opciones').value.split(',').map(s=>s.trim()).filter(Boolean); if(!p.opciones.length){ toast('Agrega al menos una opción'); return; } }
  state.surveyTemp.preguntas.push(p);
  renderModalNuevaEncuesta();
}
function eliminarPreguntaTemp(i){ state.surveyTemp.preguntas.splice(i,1); renderModalNuevaEncuesta(); }
function crearEncuesta(){
  const t = state.surveyTemp;
  if(!t.titulo.trim()){ toast('Escribe un título para la encuesta'); return; }
  if(!t.preguntas.length){ toast('Agrega al menos una pregunta'); return; }
  DB.surveys.push({id:uid('svy'), titulo:t.titulo.trim(), descripcion:t.descripcion.trim(), estado:'Activa', creada:DEMO_TODAY, preguntas:t.preguntas, respuestas:[]});
  state.surveyTemp=null; closeModal(); toast('Encuesta creada'); renderApp();
}
function cerrarEncuesta(id){ DB.surveys.find(s=>s.id===id).estado='Cerrada'; toast('Encuesta cerrada'); renderApp(); }
const CLIMA_OPCIONES = [['Siempre','😊'],['Casi siempre','🙂'],['A veces','😐'],['Casi nunca','🙁'],['Nunca','☹️']];
function renderModalResponder(surveyId){
  const s = DB.surveys.find(x=>x.id===surveyId);
  const activos = DB.empleados.filter(e=>e.estado==='Activo');
  const body = `
    <div class="field"><label>Colaborador que responde</label><select id="rs_emp">${activos.map(e=>`<option value="${e.id}" ${e.id===state.currentEmp?'selected':''}>${e.nombre}</option>`).join('')}</select></div>
    <div id="rs_preguntas">
      ${s.preguntas.map(p=>`<div class="field"><label>${p.texto}</label>${renderInputPregunta(p)}</div>`).join('')}
    </div>`;
  const foot = `<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="enviarRespuesta('${s.id}')">Enviar respuesta</button>`;
  openModal('Responder — '+s.titulo, body, foot, true);
}
function renderInputPregunta(p){
  if(p.tipo==='clima'){
    return `<div style="display:flex; gap:14px; flex-wrap:wrap;">${CLIMA_OPCIONES.map(([label,emoji])=>`
      <label style="display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; font-size:11px; color:var(--muted);">
        <input type="radio" name="rq_${p.id}" value="${label}" style="width:auto;"><span style="font-size:22px;">${emoji}</span>${label}
      </label>`).join('')}</div>`;
  }
  if(p.tipo==='opcion') return `<select id="rq_${p.id}">${p.opciones.map(o=>`<option>${o}</option>`).join('')}</select>`;
  return `<textarea id="rq_${p.id}" placeholder="Escribe tu respuesta…"></textarea>`;
}
function enviarRespuesta(surveyId){
  const s = DB.surveys.find(x=>x.id===surveyId);
  const valores = {};
  s.preguntas.forEach(p=>{
    if(p.tipo==='clima'){ const checked=document.querySelector(`input[name="rq_${p.id}"]:checked`); valores[p.id]=checked?checked.value:''; }
    else valores[p.id] = $('#rq_'+p.id).value;
  });
  s.respuestas.push({empId:$('#rs_emp').value, fecha:DEMO_TODAY, valores});
  closeModal(); toast('Respuesta registrada'); renderApp();
}
function verResultadosEncuesta(surveyId){
  const s = DB.surveys.find(x=>x.id===surveyId);
  const body = s.preguntas.map(p=>{
    if(p.tipo==='abierta'){
      const respuestas = s.respuestas.map(r=>r.valores[p.id]).filter(Boolean);
      return `<div style="margin-bottom:16px;"><h4 style="font-size:13px; margin-bottom:8px;">${p.texto}</h4>
        ${respuestas.length? respuestas.map(t=>`<p style="font-size:12.5px; border-left:2px solid var(--line); padding-left:9px; margin-bottom:6px;">${t}</p>`).join('') : '<p style="font-size:12.5px; color:var(--muted);">Sin respuestas aún.</p>'}</div>`;
    }
    const opciones = p.tipo==='clima'? CLIMA_OPCIONES.map(o=>o[0]) : p.opciones;
    const counts = opciones.map(o=> s.respuestas.filter(r=>r.valores[p.id]===o).length);
    const max = Math.max(1,...counts);
    return `<div style="margin-bottom:16px;"><h4 style="font-size:13px; margin-bottom:8px;">${p.texto}</h4>
      ${opciones.map((o,i)=>`<div class="bar-row"><div class="bl"><span>${o}</span><span>${counts[i]}</span></div><div class="bar-track"><div class="bar-fill" style="width:${counts[i]/max*100}%;"></div></div></div>`).join('')}
    </div>`;
  }).join('');
  openModal(`Resultados — ${s.titulo}`, body || emptyState('Sin datos','Esta encuesta todavía no tiene preguntas.'), `<button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>`, true);
}

function topeAdelanto(empId){ const e=emp(empId); return Math.round(e.salario*0.3/1000)*1000; }
function disponibleAdelanto(empId){
  const tope = topeAdelanto(empId);
  const retiradoMes = DB.advances.filter(a=>a.empId===empId && a.fecha.slice(0,7)===DEMO_TODAY.slice(0,7) && a.estado==='Pagado').reduce((s,a)=>s+a.monto,0);
  return Math.max(0, tope-retiradoMes);
}
function renderAdelantos(){
  const you = emp(state.currentEmp);
  const disponible = disponibleAdelanto(you.id);
  const historial = DB.advances.filter(a=>a.empId===you.id).slice().reverse();
  return `
  <div class="field" style="max-width:320px; margin-bottom:14px;"><label>Viendo adelantos de</label>
    <select onchange="state.currentEmp=this.value; renderApp();">${DB.empleados.filter(e=>e.estado==='Activo').map(e=>`<option value="${e.id}" ${e.id===you.id?'selected':''}>${e.nombre}</option>`).join('')}</select>
  </div>
  <div class="card-bar">Adelantos de sueldo — ${you.nombre}</div>
  <div class="card card-pad" style="border-radius:0 0 12px 12px; border-top:none;">
    <div class="grid grid-2" style="margin-bottom:18px;">
      <div class="card stat" style="border-left:3px solid var(--primary-2);"><div class="lbl">Disponible a retirar</div><div class="num">${fmtCOP(disponible)}</div><div class="sub">Tope mensual: ${fmtCOP(topeAdelanto(you.id))}</div></div>
      <div>
        <div class="field"><label>Monto a solicitar</label><input type="number" id="ad_monto" value="${Math.min(50000,disponible)}" step="1000" max="${disponible}"></div>
        <button class="btn btn-primary" onclick="solicitarAdelanto('${you.id}')" ${disponible<=0?'disabled':''}>Retirar ahora</button>
      </div>
    </div>
    <h3 style="font-size:13px; margin-bottom:10px;">Historial de retiros</h3>
    <div class="table-wrap"><table><thead><tr><th>Fecha de solicitud</th><th class="num-cell">Monto</th><th>Estado</th></tr></thead><tbody>
      ${historial.map(a=>`<tr><td>${fmtDate(a.fecha)}</td><td class="num-cell">${fmtCOP(a.monto)}</td><td><span class="pill pill-green">${a.estado}</span></td></tr>`).join('')}
      ${!historial.length? `<tr><td colspan="3">${emptyState('Sin retiros','Este colaborador aún no ha solicitado adelantos.')}</td></tr>`:''}
    </tbody></table></div>
  </div>`;
}
function solicitarAdelanto(empId){
  const monto = Number($('#ad_monto').value)||0;
  const disponible = disponibleAdelanto(empId);
  if(monto<=0){ toast('Ingresa un monto válido'); return; }
  if(monto>disponible){ toast('El monto supera lo disponible para retirar'); return; }
  DB.advances.push({id:uid('adv'), empId, fecha:DEMO_TODAY, monto, estado:'Pagado'});
  toast('Adelanto pagado correctamente'); renderApp();
}

  </div>`;
}
function eliminarReporte(id){ const i=DB.reports.findIndex(r=>r.id===id); if(i>-1) DB.reports.splice(i,1); renderApp(); }
function generarPlantilla(tipo){
  let headers=[], rows=[];
  if(tipo==='Nómina'){ const run=runActivo(); headers=['Colaborador','Cédula','Días','Devengado','Deducciones','Neto']; rows=run.detalles.map(d=>[emp(d.empId).nombre, emp(d.empId).cedula, d.dias, d.devengado, d.deducciones, d.neto]); }
  else if(tipo==='Colaboradores'){ headers=['Nombre','Cédula','Cargo','Área','Contrato','Salario','Estado']; rows=DB.empleados.map(e=>[e.nombre,e.cedula,e.cargo,e.area,e.contrato,e.salario,e.estado]); }
  else if(tipo==='Asistencia'){ headers=['Colaborador','Fecha','Entrada','Salida','Estado']; rows=DB.attendance.map(a=>[emp(a.empId).nombre,a.fecha,a.entrada||'',a.salida||'',a.estado]); }
  else if(tipo==='Vacaciones'){ headers=['Colaborador','Tipo','Inicio','Fin','Días','Estado']; rows=DB.leaveRequests.map(l=>[emp(l.empId).nombre,l.tipo,l.inicio,l.fin,l.dias,l.estado]); }
  else if(tipo==='Firma de documentos'){ headers=['Documento','Colaborador','Tipo','Estado','Fecha firma']; rows=DB.documents.map(d=>[d.nombre,emp(d.empId).nombre,d.tipo,d.estado,d.firmaFecha||'']); }
  else if(tipo==='Beneficios'){ headers=['Colaborador','Beneficio','Fecha','Estado']; rows=DB.benefitRequests.map(b=>[emp(b.empId).nombre,DB.benefits.find(x=>x.id===b.beneficioId).nombre,b.fecha,b.estado]); }
  else if(tipo==='Reconocimientos'){ headers=['De','Para','Categoría','Fecha','Likes']; rows=DB.recognitions.map(r=>[emp(r.de).nombre,emp(r.para).nombre,r.categoria,r.fecha,r.likes]); }
  else if(tipo==='Objetivos'){ headers=['Colaborador','Tipo','Descripción','Peso','Avance','Fecha término']; rows=DB.objectives.map(o=>[emp(o.empId).nombre,o.tipo,o.descripcion,o.peso,o.avance,o.fechaTermino]); }
  else if(tipo==='Activos'){ headers=['Activo','Categoría','Tipo','Estado','Asignado a','Valor']; rows=DB.assets.map(a=>[a.nombre,a.categoria,a.tipo,a.estado,a.asignadoA?emp(a.asignadoA).nombre:'',a.valor]); }
  else if(tipo==='Encuestas'){ headers=['Encuesta','Estado','Preguntas','Respuestas']; rows=DB.surveys.map(s=>[s.titulo,s.estado,s.preguntas.length,s.respuestas.length]); }
  else if(tipo==='Denuncias'){ headers=['Folio','Categoría','Origen','Prioridad','Estado']; rows=DB.complaints.map(c=>[c.folio,c.categoria,c.anonimo?'Anónimo':c.relacion,c.prioridad,c.estado]); }
  const filename = tipo.toLowerCase().replace(/\s+/g,'_')+'_'+DEMO_TODAY+'.csv';
  exportCSV(filename, headers, rows);
  DB.reports.push({id:uid('rep'), nombre:tipo+' — '+fmtDate(DEMO_TODAY), tipo:'Exportado', usuario: emp(state.currentEmp)? emp(state.currentEmp).nombre : 'Daniela Fernández', fecha:new Date().toISOString()});
  toast('Reporte descargado'); if(state.view==='reportes') renderApp();
}

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault(); deferredPrompt = e;
  $('#installBtn').hidden=false; $('#installBtnTop').hidden=false;
});
function installApp(){
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(()=>{ deferredPrompt=null; $('#installBtn').hidden=true; $('#installBtnTop').hidden=true; });
}
window.addEventListener('appinstalled', ()=>{ toast('Bitácora se instaló correctamente'); $('#installBtn').hidden=true; $('#installBtnTop').hidden=true; });

if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch((err)=> console.warn('No se pudo registrar el service worker:', err));
  });
}

/* =========================================================
   INICIO
   ========================================================= */
renderApp();
</script>
