  </div>`;
}
function eliminarReporte(id){ const i=DB.reports.findIndex(r=>r.id===id); if(i>-1) DB.reports.splice(i,1); renderApp(); }
function generarPlantilla(tipo){
  let headers=[], rows=[];
  if(tipo==='Nómina'){ const run=runActivo(); if(run){ headers=['Colaborador','Cédula','Días','Devengado','Deducciones','Neto']; rows=run.detalles.map(d=>[empNombre(d.empId), (emp(d.empId)||{}).cedula||'', d.dias, d.devengado, d.deducciones, d.neto]); } }
  else if(tipo==='Colaboradores'){ headers=['Nombre','Cédula','Cargo','Área','Contrato','Salario','Estado']; rows=DB.empleados.map(e=>[e.nombre,e.cedula,e.cargo,e.area,e.contrato,e.salario,e.estado]); }
  else if(tipo==='Asistencia'){ headers=['Colaborador','Fecha','Entrada','Salida','Estado']; rows=DB.attendance.map(a=>[empNombre(a.empId),a.fecha,a.entrada||'',a.salida||'',a.estado]); }
  else if(tipo==='Vacaciones'){ headers=['Colaborador','Tipo','Inicio','Fin','Días','Estado']; rows=DB.leaveRequests.map(l=>[empNombre(l.empId),l.tipo,l.inicio,l.fin,l.dias,l.estado]); }
  else if(tipo==='Firma de documentos'){ headers=['Documento','Colaborador','Tipo','Estado','Fecha firma']; rows=DB.documents.map(d=>[d.nombre,empNombre(d.empId),d.tipo,d.estado,d.firmaFecha||'']); }
  else if(tipo==='Beneficios'){ headers=['Colaborador','Beneficio','Fecha','Estado']; rows=DB.benefitRequests.map(b=>[empNombre(b.empId),DB.benefits.find(x=>x.id===b.beneficioId).nombre,b.fecha,b.estado]); }
  else if(tipo==='Reconocimientos'){ headers=['De','Para','Categoría','Fecha','Likes']; rows=DB.recognitions.map(r=>[empNombre(r.de),empNombre(r.para),r.categoria,r.fecha,r.likes]); }
  else if(tipo==='Objetivos'){ headers=['Colaborador','Tipo','Descripción','Peso','Avance','Fecha término']; rows=DB.objectives.map(o=>[empNombre(o.empId),o.tipo,o.descripcion,o.peso,o.avance,o.fechaTermino]); }
  else if(tipo==='Activos'){ headers=['Activo','Categoría','Tipo','Estado','Asignado a','Valor']; rows=DB.assets.map(a=>[a.nombre,a.categoria,a.tipo,a.estado,a.asignadoA?empNombre(a.asignadoA):'',a.valor]); }
  else if(tipo==='Encuestas'){ headers=['Encuesta','Estado','Preguntas','Respuestas']; rows=DB.surveys.map(s=>[s.titulo,s.estado,s.preguntas.length,s.respuestas.length]); }
  else if(tipo==='Denuncias'){ headers=['Folio','Categoría','Origen','Prioridad','Estado']; rows=DB.complaints.map(c=>[c.folio,c.categoria,c.anonimo?'Anónimo':c.relacion,c.prioridad,c.estado]); }
  const filename = tipo.toLowerCase().replace(/\s+/g,'_')+'_'+DEMO_TODAY+'.csv';
  exportCSV(filename, headers, rows);
  DB.reports.push({id:uid('rep'), nombre:tipo+' — '+fmtDate(DEMO_TODAY), tipo:'Exportado', usuario: emp(state.currentEmp)? emp(state.currentEmp).nombre : 'Daniela Fernández', fecha:new Date().toISOString()});
  toast('Reporte descargado'); if(state.view==='reportes') renderApp();
}

function portalLoginHtml(){

function portalIngresar(){

function portalEnviarSolicitud(){
  const ini=$('#ps_ini').value, fin=$('#ps_fin').value;

    <div class="topbrand"><div class="mark">${iniciales(CFG.companyName||'B')}</div><div><div class="name">${CFG.companyName||'Bitácora'}</div><div class="sub">Kiosco de marcación</div></div></div>
    <div class="kiosk-clock" id="kioskClock">--:--:--</div>
    <div class="kiosk-date" id="kioskDate"></div>
    <div class="mode-tabs">
      <button class="${kioscoState.modo==='huella'?'active':''}" onclick="kioscoModo('huella')">🖐️ Huella</button>
      <button class="${kioscoState.modo==='nfc'?'active':''}" onclick="kioscoModo('nfc')">📶 NFC</button>
      <button class="${kioscoState.modo==='manual'?'active':''}" onclick="kioscoModo('manual')">⌨️ Manual</button>
    </div>
    <div id="kioskStatus" class="kiosk-status idle">Selecciona un modo de marcación para comenzar.</div>
    <div id="kioskBody" style="margin-top:16px;"></div>
  </div>`;
  actualizarReloj();
  if(!_kioskClockTimer) _kioskClockTimer = setInterval(actualizarReloj, 1000);
  renderKioscoBody();
}
function actualizarReloj(){
  const el = $('#kioskClock'); if(!el) return;
  const now = new Date();
  el.textContent = now.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const dEl = $('#kioskDate'); if(dEl) dEl.textContent = now.toLocaleDateString('es-CO',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
}
function kioscoModo(m){
  if(_nfcScanController){ _nfcScanController.abort(); _nfcScanController = null; } // deja de escuchar NFC al cambiar de modo
  kioscoState.modo=m; renderKiosco();
}
function kioscoSetStatus(tipo, msg){ const el=$('#kioskStatus'); if(el){ el.className='kiosk-status '+tipo; el.textContent=msg; } }
function renderKioscoBody(){
  const el = $('#kioskBody'); if(!el) return;
  if(kioscoState.modo==='manual'){
    el.innerHTML = `
      <div class="card card-pad">
        <div class="field"><label>Número de cédula</label><input id="kk_cedula" placeholder="Escribe tu cédula" onkeydown="if(event.key==='Enter') kioscoMarcarManual();"></div>
        <button class="btn btn-primary btn-block" onclick="kioscoMarcarManual()">Marcar entrada / salida</button>
      </div>`;
  } else if(kioscoState.modo==='nfc'){
    const soportado = 'NDEFReader' in window;
    el.innerHTML = `
      <div class="card card-pad">
        <p class="hint" style="margin-bottom:12px;">Acerca la tarjeta o llavero NFC del colaborador al lector del dispositivo. Requiere Chrome para Android sobre HTTPS.</p>
        <button id="kk_nfc_btn" class="btn btn-primary btn-block" ${soportado?'':'disabled'} onclick="kioscoEscanearNFC()">📶 Escanear tarjeta NFC</button>
        ${soportado? '' : '<p class="hint" style="margin-top:8px; color:var(--danger);">Web NFC no está disponible en este navegador/dispositivo.</p>'}
      </div>`;
  } else if(kioscoState.modo==='huella'){
    const soportado = !!window.PublicKeyCredential;
    el.innerHTML = `
      <div class="card card-pad">
        <p class="hint" style="margin-bottom:12px;">Usa el sensor biométrico, Face ID o Windows Hello de este equipo. Primero registra la huella de cada colaborador una vez en él.</p>
        <div class="field"><label>Cédula (para registrar huella)</label><input id="kk_cedula_h" placeholder="Cédula del colaborador"></div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn btn-ghost" ${soportado?'':'disabled'} onclick="kioscoRegistrarHuella()">Registrar huella</button>
          <button class="btn btn-primary" ${soportado?'':'disabled'} onclick="kioscoMarcarHuella()">Marcar con huella</button>
        </div>
        ${soportado? '' : '<p class="hint" style="margin-top:8px; color:var(--danger);">Este navegador no soporta WebAuthn.</p>'}
      </div>`;
  }
}
function kioscoBuscarPorCedula(ced){
  return DB.empleados.find(x=>x.cedula && x.cedula.replace(/\D/g,'')===String(ced).replace(/\D/g,'') && x.estado==='Activo');
}
function kioscoRegistrarMarcacion(e, metodo){
  const now = new Date();
  const hora = now.toTimeString().slice(0,5);
  let rec = DB.attendance.find(a=>a.empId===e.id && a.fecha===DEMO_TODAY);
  if(!rec){ rec = {id:uid('att'), empId:e.id, fecha:DEMO_TODAY, entrada:null, salida:null, estado:'A tiempo', metodo, marcas:[]}; DB.attendance.push(rec); }
  if(!rec.marcas) rec.marcas = marcasDeRegistro(rec);
  /* Permite varios ciclos de entrada/salida en el mismo día: se alterna según
     cuál fue la última marcación registrada (si la última fue "Salida" o no
     hay ninguna, la siguiente es "Entrada"; si estaba abierta, es "Salida"). */
  const ultima = rec.marcas[rec.marcas.length-1];
  const tipo = (!ultima || ultima.tipo==='Salida') ? 'Entrada' : 'Salida';
  rec.marcas.push({hora, tipo});
  rec.metodo = metodo;
  if(tipo==='Entrada'){
    if(!rec.entrada) rec.entrada = hora;
    const numEntrada = rec.marcas.filter(m=>m.tipo==='Entrada').length;
    const evalR = evaluarEntrada(e, hora, numEntrada);
    const esTarde = evalR!==null ? evalR==='Tarde' : (hora > '08:05'); // sin horario definido: se usa el umbral por defecto
    if(esTarde) rec.estado = 'Tarde';
  } else {
    rec.salida = hora; // guarda la última salida del día para compatibilidad
  }
  rec.horasDia = Math.round(horasDeRegistro(rec).horas*100)/100;
  sbRegistrarMarcacion(rec);
  kioscoSetStatus('ok', `${tipo} registrada — ${e.nombre} (${hora}) · ${rec.horasDia}h trabajadas hoy`);
  verificarAlertaHoras(e);
  return tipo;
}
function kioscoMarcarManual(){
  const ced = ($('#kk_cedula').value||'').trim();
  if(!ced){ kioscoSetStatus('err','Escribe un número de cédula.'); return; }
  const e = kioscoBuscarPorCedula(ced);
  if(!e){ kioscoSetStatus('err','No se encontró un colaborador activo con esa cédula.'); return; }
  kioscoRegistrarMarcacion(e, 'Manual');
  const i=$('#kk_cedula'); if(i) i.value='';
}
/* Igual que con la asignación de tag: solo puede haber una sesión de escaneo
   NFC activa a la vez. Si se vuelve a presionar "Escanear tarjeta NFC" (o se
   cambia de pestaña y se regresa) sin haber cancelado la sesión anterior,
   Chrome puede dejar dos escuchas activas y un mismo toque de tarjeta
   terminaría registrando entrada y salida al mismo tiempo. */
let _nfcScanController = null;
let _kioscoUltimaMarcacion = {}; // empId -> timestamp ms, evita registrar dos veces la misma lectura
async function kioscoEscanearNFC(){
  if(!('NDEFReader' in window)){ kioscoSetStatus('err','Web NFC no disponible en este dispositivo/navegador.'); return; }
  if(_nfcScanController){ _nfcScanController.abort(); _nfcScanController = null; }
  const controller = new AbortController();
  _nfcScanController = controller;
  const btn = $('#kk_nfc_btn');
  try{
    const reader = new NDEFReader();
    await reader.scan({ signal: controller.signal });
    kioscoSetStatus('idle','Acerca la tarjeta al lector…');
    if(btn){ btn.disabled = true; btn.textContent = '📶 Escuchando… acerca la tarjeta'; }
    reader.onreading = (event)=>{
      let cedula = '';
      for(const record of event.message.records){
        if(record.recordType==='text'){ cedula = new TextDecoder(record.encoding||'utf-8').decode(record.data); break; }
      }
      if(!cedula) cedula = event.serialNumber||'';
      const e = kioscoBuscarPorCedula(cedula);
      if(!e){ kioscoSetStatus('err','Tarjeta no reconocida — verifica que tenga grabada la cédula del colaborador.'); return; }
      const ahora = Date.now();
      if(ahora - (_kioscoUltimaMarcacion[e.id]||0) < 4000) return; // ignora lecturas repetidas del mismo toque
      _kioscoUltimaMarcacion[e.id] = ahora;
      const tipo = kioscoRegistrarMarcacion(e, 'NFC');
      if(tipo) mostrarCheckExito(`${tipo} registrada — ${e.nombre}`);
    };
    reader.onreadingerror = ()=> kioscoSetStatus('err','No se pudo leer la tarjeta, intenta de nuevo.');
  } catch(err){
    if(_nfcScanController===controller) _nfcScanController = null;
    if(btn){ btn.disabled=false; btn.textContent='📶 Escanear tarjeta NFC'; }
    if(err.name==='AbortError'){ /* cancelada a propósito por un nuevo intento, no es un error real */ }
    else { kioscoSetStatus('err','No se pudo activar el lector NFC: '+err.message); }
  }
}
function b64uToBuf(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; const bin=atob(s); const buf=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i); return buf.buffer; }
function bufToB64u(buf){ let bin=''; new Uint8Array(buf).forEach(b=>bin+=String.fromCharCode(b)); return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
async function kioscoRegistrarHuella(){
  if(!window.PublicKeyCredential){ kioscoSetStatus('err','Este navegador no soporta WebAuthn.'); return; }
  const ced = ($('#kk_cedula_h').value||'').trim();
  const e = kioscoBuscarPorCedula(ced);
  if(!e){ kioscoSetStatus('err','No se encontró un colaborador activo con esa cédula.'); return; }
  try{
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const cred = await navigator.credentials.create({ publicKey:{
      challenge, rp:{ name: CFG.companyName||'Bitácora RRHH' },
      user:{ id: new TextEncoder().encode(e.id), name:e.cedula, displayName:e.nombre },
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{ authenticatorAttachment:'platform', userVerification:'required', residentKey:'required' },
      timeout:60000,
    }});
    const credential_id = bufToB64u(cred.rawId);
    let public_key = '';
    try{ if(cred.response.getPublicKey) public_key = bufToB64u(cred.response.getPublicKey()); }catch(_e){}
    const huella = {credential_id, empleado_id:e.id, public_key, counter:0};
    DB.huellas.push(huella);
    e.huella = true;
    sbGuardarHuella(huella);
    sbGuardarEmpleado(e);
    kioscoSetStatus('ok', `Huella registrada para ${e.nombre}.`);
    const i=$('#kk_cedula_h'); if(i) i.value='';
  } catch(err){ kioscoSetStatus('err','No se pudo registrar la huella: '+err.message); }
}
async function kioscoMarcarHuella(){
  if(!window.PublicKeyCredential){ kioscoSetStatus('err','Este navegador no soporta WebAuthn.'); return; }
  try{
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const aser = await navigator.credentials.get({ publicKey:{ challenge, userVerification:'required', timeout:60000 } });
    const credential_id = bufToB64u(aser.rawId);
    const h = DB.huellas.find(x=>x.credential_id===credential_id);
    if(!h){ kioscoSetStatus('err','Huella no registrada en este kiosco.'); return; }
    const e = emp(h.empleado_id);
    if(!e){ kioscoSetStatus('err','Colaborador no encontrado.'); return; }
    kioscoRegistrarMarcacion(e, 'Huella');
  } catch(err){ kioscoSetStatus('err','No se pudo leer la huella: '+err.message); }
}

/* =========================================================
   PWA: instalación y service worker
   ========================================================= */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault(); deferredPrompt = e;
  $('#installBtn').hidden=false; $('#installBtnTop').hidden=false;
});
function installApp(){
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(()=>{ deferredPrompt=null; $('#installBtn').hidden=true; $('#installBtnTop').hidden=true; });
}
window.addEventListener('appinstalled', ()=>{ toast('Bitácora se instaló correctamente'); $('#installBtn').hidden=true; $('#installBtnTop').hidden=true; });

if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch((err)=> console.warn('No se pudo registrar el service worker:', err));
  });
}

function irSegunHash(){
  const h = location.hash.replace('#','');
  if(h==='colaborador') mostrarPortal();
  else if(h==='kiosco') mostrarKiosco();
  else if(h==='admin') mostrarAdmin();
  else mostrarSelector();
}
async function initApp(){
  await cargarDesdeSupabase();
  DB.payrollRuns.forEach(run=> run.detalles.forEach(d=>{ const e=emp(d.empId); if(e) calcularDetalle(d, e); }));
  /* sincroniza el estado de navegación con los datos reales ya cargados,
     por si los IDs por defecto ya no existen (o todavía no hay ninguno) */
  if(!DB.empleados.find(e=>e.id===state.currentEmp)) state.currentEmp = DB.empleados[0]? DB.empleados[0].id : null;
  if(!DB.empleados.find(e=>e.id===state.objEmp)) state.objEmp = DB.empleados[0]? DB.empleados[0].id : null;
  if(!DB.payrollRuns.find(r=>r.id===state.payrollOpenRun)) state.payrollOpenRun = DB.payrollRuns.length? DB.payrollRuns[DB.payrollRuns.length-1].id : null;
  irSegunHash();
}
window.addEventListener('hashchange', irSegunHash);
initApp();

/* Revisa cada minuto si algún colaborador activo superó la jornada semanal
   máxima, mientras el panel de administrador esté abierto (la alarma sonora
   solo tiene sentido si hay alguien frente a esta pantalla para escucharla). */
setInterval(()=>{
  const rootAdmin = $('#rootAdmin');
  if(rootAdmin && !rootAdmin.classList.contains('hidden')) verificarTodasLasAlertasHoras();
}, 60000);
