<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Marcación · Bitácora</title>
<meta name="theme-color" content="#1E3A75">
<link rel="stylesheet" href="../assets/styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="kiosk-body">
  <div class="kiosk-clock">
    <div class="time" id="kClock">--:--</div>
    <div class="date" id="kDate">—</div>
  </div>
  <div class="kiosk-card" id="kioskCard">
    <div class="empty"><div class="big">Cargando…</div><div>Conectando con Supabase</div></div>
  </div>
  <p style="color:rgba(255,255,255,.75); font-size:11.5px; margin-top:16px; max-width:480px; text-align:center;">
    Terminal de marcación de Bitácora · <a href="../admin/" style="color:#fff; text-decoration:underline;">Ir al panel de administración</a>
  </p>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/supabase-config.js"></script>
<script>
/* =========================================================
   Kiosco de marcación — /checador
   =========================================================
   Tres formas de identificarte:
   1) Manual: buscas tu nombre y confirmas en pantalla.
   2) NFC: solo funciona en Chrome para Android con NFC activado
      (API Web NFC). En el resto de navegadores no hay forma de leer
      una tarjeta NFC desde una página web — se los avisamos en pantalla
      en vez de simular que "funciona".
   3) Huella / Face ID: usa el sensor biométrico DEL DISPOSITIVO donde
      se abre esta página (WebAuthn), no un lector de huella USB
      compartido. Cada persona debe "registrar su huella" una vez en
      el dispositivo que va a usar para marcar (su celular, o una
      tablet fija si todos van a tocar el mismo sensor). Un lector de
      huella dedicado para un puesto de recepción compartido requiere
      hardware y software propio del fabricante (ZKTeco, Suprema, etc.):
      eso no lo puede operar una página web.
*/
let empleados = [];
let modo = 'manual';
let empSel = null;

function $(s,c=document){return c.querySelector(s);}
function iniciales(n){return n.split(' ').filter(Boolean).slice(0,2).map(p=>p[0]).join('').toUpperCase();}
function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  $('#toastRoot').appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{t.classList.remove('show'); setTimeout(()=>t.remove(),300);},2600);
}
function hoyISO(){ return new Date().toISOString().slice(0,10); }
function horaAhora(){ return new Date().toTimeString().slice(0,5); }

function tickClock(){
  const now = new Date();
  $('#kClock').textContent = now.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  $('#kDate').textContent = now.toLocaleDateString('es-CO',{weekday:'long', day:'numeric', month:'long'});
}
setInterval(tickClock, 1000); tickClock();

async function cargarEmpleados(){
  const {data, error} = await sb.from('empleados').select('*').eq('estado','Activo').order('nombre');
  if(error){ toast('No se pudo conectar a Supabase: '+error.message); empleados=[]; return; }
  empleados = data;
}

function renderKiosk(){
  const card = $('#kioskCard');
  card.innerHTML = `
    <div class="kiosk-methods">
      <button class="${modo==='manual'?'active':''}" onclick="cambiarModo('manual')">🔍 Manual</button>
      <button class="${modo==='nfc'?'active':''}" onclick="cambiarModo('nfc')">📶 NFC</button>
      <button class="${modo==='huella'?'active':''}" onclick="cambiarModo('huella')">🖐️ Huella / Face ID</button>
    </div>
    <div id="kioskBody"></div>`;
  renderModo();
}
function cambiarModo(m){ modo=m; empSel=null; renderKiosk(); }

function renderModo(){
  if(modo==='manual') renderManual();
  else if(modo==='nfc') renderNfc();
  else renderHuella();
}

/* ---------------- Manual ---------------- */
function renderManual(q){
  q = (q||'').toLowerCase();
  const list = empleados.filter(e=> e.nombre.toLowerCase().includes(q));
  $('#kioskBody').innerHTML = `
    <div class="field"><input placeholder="Busca tu nombre…" oninput="renderManual(this.value)" autofocus></div>
    <div class="kiosk-grid">
      ${list.map(e=>`<div class="kiosk-emp" onclick="confirmarPersona('${e.id}')"><div class="hex hex-md">${iniciales(e.nombre)}</div><div class="nm">${e.nombre.split(' ').slice(0,2).join(' ')}</div></div>`).join('')
        || '<p style="grid-column:1/-1; text-align:center; color:var(--muted); font-size:12.5px; padding:20px 0;">Sin resultados. Pide a un administrador que te registre en /admin.</p>'}
    </div>`;
}
function confirmarPersona(empId){
  const e = empleados.find(x=>x.id===empId); if(!e) return;
  $('#kioskBody').innerHTML = `
    <div class="kiosk-confirm">
      <div class="hex-ring"><div class="hex hex-lg">${iniciales(e.nombre)}</div></div>
      <h2>¿Eres ${e.nombre.split(' ')[0]}?</h2>
      <div class="sub">${e.cargo||''}</div>
      <div class="kiosk-punch-btns">
        <button class="btn btn-teal" onclick="marcar('${e.id}','Entrada','Manual')">Marcar entrada</button>
        <button class="btn btn-primary" onclick="marcar('${e.id}','Salida','Manual')">Marcar salida</button>
      </div>
      <button class="btn btn-ghost btn-sm" style="margin-top:14px;" onclick="renderModo()">No soy yo, volver</button>
    </div>`;
}

/* ---------------- NFC ---------------- */
function renderNfc(){
  const soportado = 'NDEFReader' in window;
  if(!soportado){
    $('#kioskBody').innerHTML = `
      <div class="empty">
        <div class="big">Este navegador no soporta NFC</div>
        <div>La lectura NFC desde la web (Web NFC) solo funciona en Chrome para Android, con el NFC del teléfono activado y por HTTPS. En computadores y en iPhone no hay forma de leerla desde una página web — usa "Manual" o "Huella / Face ID" aquí.</div>
      </div>`;
    return;
  }
  $('#kioskBody').innerHTML = `
    <div class="nfc-scan">
      <div class="pulse">📶</div>
      <p style="font-size:13px; margin-bottom:14px;">Acerca tu tarjeta o llavero NFC a la parte trasera del teléfono.</p>
      <button class="btn btn-primary" onclick="iniciarEscaneoNfc()">Empezar a escanear</button>
      <p id="nfcMsg" style="font-size:12px; color:var(--muted); margin-top:10px;"></p>
    </div>`;
}
async function iniciarEscaneoNfc(){
  try{
    const reader = new NDEFReader();
    await reader.scan();
    $('#nfcMsg').textContent = 'Escaneando… acerca la tarjeta.';
    reader.onreading = (event)=>{
      const serial = event.serialNumber;
      const e = empleados.find(x=>x.nfc_id && x.nfc_id===serial);
      if(!e){ $('#nfcMsg').textContent = `Tarjeta no registrada (serial ${serial}). Pide a un administrador que la asocie a tu perfil desde /admin.`; return; }
      marcarInteligente(e.id, 'NFC');
    };
    reader.onreadingerror = ()=>{ $('#nfcMsg').textContent = 'No se pudo leer la tarjeta, intenta de nuevo.'; };
  }catch(err){
    $('#nfcMsg').textContent = 'No se pudo activar el NFC: '+err.message+' (revisa que el NFC del teléfono esté encendido y que hayas dado permiso).';
  }
}

/* ---------------- Huella / Face ID (WebAuthn) ---------------- */
function b64urlToBuf(b64url){
  const b64 = b64url.replace(/-/g,'+').replace(/_/g,'/').padEnd(b64url.length + (4 - b64url.length%4)%4, '=');
  const bin = atob(b64); const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes.buffer;
}
function bufToB64url(buf){
  const bytes = new Uint8Array(buf); let bin='';
  for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function randomChallenge(){ const b=new Uint8Array(32); crypto.getRandomValues(b); return b; }

async function renderHuella(){
  const disponible = window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().catch(()=>false);
  if(!window.PublicKeyCredential){
    $('#kioskBody').innerHTML = `<div class="empty"><div class="big">Este navegador no soporta biometría web</div><div>Prueba con Chrome, Edge o Safari actualizados.</div></div>`;
    return;
  }
  $('#kioskBody').innerHTML = `
    <p style="font-size:12px; color:var(--muted); margin-bottom:14px;">Esto usa el sensor de huella o Face ID <strong>de este dispositivo</strong> (no un lector compartido). Cada persona registra su huella una sola vez aquí, y luego puede marcar tocando el sensor.</p>
    ${!disponible? `<div class="auth-note">Este dispositivo no tiene un sensor biométrico disponible para el navegador (o no diste permiso). Usa "Manual" para marcar.</div>` : `
    <button class="btn btn-primary" style="width:100%; justify-content:center; margin-bottom:10px;" onclick="marcarConHuella()">🖐️ Marcar con huella / Face ID</button>
    <div class="field" style="margin-top:16px;"><label>Registrar la huella de:</label>
      <select id="hu_emp">${empleados.map(e=>`<option value="${e.id}">${e.nombre}</option>`).join('')}</select>
    </div>
    <button class="btn btn-ghost" style="width:100%; justify-content:center;" onclick="registrarHuellaWebAuthn()">+ Registrar mi huella en este dispositivo</button>
    `}
    <p id="huMsg" style="font-size:12px; color:var(--muted); margin-top:10px;"></p>`;
}
async function registrarHuellaWebAuthn(){
  const empId = $('#hu_emp').value; const e = empleados.find(x=>x.id===empId);
  try{
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: randomChallenge(),
      rp: { name: 'Bitácora RRHH' },
      user: { id: b64urlToBuf(btoa(empId).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')), name: e.email||e.nombre, displayName: e.nombre },
      pubKeyCredParams: [{type:'public-key', alg:-7}, {type:'public-key', alg:-257}],
      authenticatorSelection: { authenticatorAttachment:'platform', userVerification:'required' },
      timeout: 60000,
    }});
    const credentialId = bufToB64url(cred.rawId);
    const {error} = await sb.from('empleados').update({huella:true, webauthn_credential_id:credentialId}).eq('id', empId);
    if(error){ toast('Error al guardar en Supabase: '+error.message); return; }
    e.huella = true; e.webauthn_credential_id = credentialId;
    toast('Huella registrada para '+e.nombre.split(' ')[0]);
    $('#huMsg').textContent = '¡Listo! Ya puedes marcar con el botón de arriba.';
  }catch(err){
    $('#huMsg').textContent = 'No se pudo registrar: '+err.message;
  }
}
async function marcarConHuella(){
  const registrados = empleados.filter(e=>e.webauthn_credential_id);
  if(!registrados.length){ $('#huMsg').textContent = 'Todavía nadie ha registrado su huella en este dispositivo.'; return; }
  try{
    const cred = await navigator.credentials.get({ publicKey: {
      challenge: randomChallenge(),
      allowCredentials: registrados.map(e=>({ type:'public-key', id: b64urlToBuf(e.webauthn_credential_id) })),
      userVerification: 'required',
      timeout: 60000,
    }});
    const credentialId = bufToB64url(cred.rawId);
    const e = registrados.find(x=>x.webauthn_credential_id===credentialId);
    if(!e){ $('#huMsg').textContent = 'No se reconoció esa huella.'; return; }
    marcarInteligente(e.id, 'Huella');
  }catch(err){
    $('#huMsg').textContent = 'No se pudo verificar: '+err.message;
  }
}

/* ---------------- Registrar marcación ---------------- */
async function marcarInteligente(empId, metodo){
  // NFC y huella no preguntan "entrada o salida": lo deducen solo.
  const {data:existing} = await sb.from('asistencia').select('*').eq('empleado_id', empId).eq('fecha', hoyISO()).maybeSingle();
  if(existing && existing.entrada && existing.salida){
    const e = empleados.find(x=>x.id===empId);
    mostrarEstado('ℹ️', 'var(--info)', `${e? e.nombre.split(' ')[0]:'Ya'} ya registró entrada y salida hoy.`);
    return;
  }
  const tipo = (!existing || !existing.entrada) ? 'Entrada' : 'Salida';
  await marcar(empId, tipo, metodo);
}
async function marcar(empId, tipo, metodo){
  const e = empleados.find(x=>x.id===empId);
  const hora = horaAhora();
  const payload = { empleado_id: empId, fecha: hoyISO(), metodo };
  if(tipo==='Entrada'){ payload.entrada = hora; payload.estado = hora > '08:05' ? 'Tarde' : 'A tiempo'; }
  else { payload.salida = hora; }
  const {error} = await sb.from('asistencia').upsert(payload, {onConflict:'empleado_id,fecha'});
  if(error){ mostrarEstado('⚠️','var(--danger)','No se pudo registrar: '+error.message); return; }
  mostrarEstado(tipo==='Entrada'?'✅':'👋', tipo==='Entrada'?'var(--success)':'var(--primary-2)',
    `${tipo} registrada para ${e? e.nombre.split(' ')[0] : ''} a las ${hora}`);
}
function mostrarEstado(icono, color, texto){
  $('#kioskBody').innerHTML = `
    <div class="kiosk-status">
      <div class="ring" style="background:${color};">${icono}</div>
      <p style="font-size:14px; font-weight:600;">${texto}</p>
    </div>`;
  setTimeout(()=>{ empSel=null; renderModo(); }, 2600);
}

(async function init(){
  await cargarEmpleados();
  renderKiosk();
})();
</script>
</body>
</html>
