<style>
:root{
  --primary:#1E3A75; --primary-2:#2F56B0; --primary-3:#4C7CE0; --primary-soft:#E4EAF9;
  --accent:#F5A623; --accent-soft:#FDECC8; --accent-deep:#C97F0A;
  --success:#16A34A; --success-soft:#DCFCE7;
  --danger:#DC2626; --danger-soft:#FEE2E2;
  --info:#0EA5E9; --info-soft:#E0F2FE;
  --violet:#7C5CD6; --violet-soft:#EBE4FA;
  --bg:#EEF1F7; --card:#FFFFFF; --line:#E3E8F0; --line-soft:#EEF1F7;
  --text:#1F2A44; --muted:#67748E;
  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(30,58,117,.06), 0 1px 1px rgba(30,58,117,.04);
  --shadow-lg:0 18px 40px rgba(20,32,64,.18);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif; color:var(--text); background:var(--bg);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Plus Jakarta Sans',sans-serif; margin:0; color:var(--primary); font-weight:700;}
p{margin:0;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit; font-size:14px;}
a{color:inherit;}
::selection{background:var(--accent-soft);}
:focus-visible{outline:2px solid var(--primary-3); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }

/* ---------- layout ---------- */
.app{display:flex; min-height:100vh;}
.sidebar{
  width:252px; flex:0 0 252px; background:var(--primary); color:#DCE3F5;
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{padding:20px 20px 16px; display:flex; align-items:center; gap:10px;}
.brand .mark{width:34px; height:34px; border-radius:9px; background:var(--primary-3); display:flex; align-items:center; justify-content:center; font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; color:#fff; font-size:16px; position:relative; flex:0 0 auto;}
.brand .mark::after{content:''; position:absolute; top:-3px; right:-3px; width:9px; height:9px; border-radius:50%; background:var(--accent); border:2px solid var(--primary);}
.brand-name{font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:18px; color:#fff; line-height:1.1;}
.brand-sub{font-size:10.5px; color:#9FADD1; margin-top:1px;}
.company-line{padding:0 20px 14px; font-size:11.5px; color:#8494C0; border-bottom:1px solid rgba(255,255,255,.1); padding-bottom:14px;}
.navgroups{padding:8px 12px 10px; flex:1;}
.navgroup{margin-bottom:2px;}
.navgroup-head{width:100%; display:flex; align-items:center; justify-content:space-between; background:none; border:none; color:#AEB9DA; font-size:11.5px; font-weight:700; padding:14px 10px 6px; cursor:pointer; letter-spacing:.2px;}
.navgroup-head .chev{transition:transform .15s; font-size:12px;}
.navgroup-head .chev.open{transform:rotate(180deg);}
ul.navlist{list-style:none; margin:0; padding:0; overflow:hidden; max-height:600px; transition:max-height .2s ease;}
ul.navlist.closed{max-height:0;}
ul.navlist li{margin-bottom:1px;}
ul.navlist button{
  width:100%; text-align:left; background:transparent; border:none; color:#C7D0EA;
  padding:9px 12px; border-radius:8px; font-size:13.3px; cursor:pointer; display:flex;
  align-items:center; gap:9px; font-weight:500;
}
ul.navlist button .ico{width:16px; text-align:center; opacity:.85; font-size:13px;}
ul.navlist button:hover{background:rgba(255,255,255,.07); color:#fff;}
ul.navlist button.active{background:var(--primary-3); color:#fff; font-weight:700; box-shadow:var(--shadow);}
.badge-nav{margin-left:auto; background:var(--accent); color:#3A2600; font-size:10px; font-weight:800; border-radius:20px; padding:1px 6px; min-width:16px; text-align:center;}
.sidebar-foot{padding:12px 20px 16px; font-size:10.5px; color:#7C8AB2; border-top:1px solid rgba(255,255,255,.08);}
.sidebar-foot button{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); color:#fff; font-size:11.5px; padding:7px 10px; border-radius:7px; cursor:pointer; width:100%; margin-top:8px; font-weight:600;}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:30; background:rgba(255,255,255,.9); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line); padding:12px 26px; display:flex; align-items:center; gap:16px;
}
.menu-toggle{display:none; background:none; border:1px solid var(--line); border-radius:8px; padding:7px 10px; cursor:pointer; font-size:15px;}
.search-wrap{position:relative; flex:1; max-width:380px;}
.search-wrap input{width:100%; padding:9px 12px 9px 34px; border:1px solid var(--line); border-radius:9px; background:var(--bg); font-size:13px;}
.search-wrap .sico{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:13px;}
.search-drop{position:absolute; top:calc(100% + 6px); left:0; right:0; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow-lg); max-height:280px; overflow-y:auto; z-index:40;}
.search-drop .row{padding:9px 12px; cursor:pointer; display:flex; align-items:center; gap:9px;}
.search-drop .row:hover{background:var(--bg);}
.topbar-spacer{flex:1;}
.topbar-icons{display:flex; align-items:center; gap:4px;}
.ticon{position:relative; background:none; border:none; width:36px; height:36px; border-radius:9px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; color:var(--primary);}
.ticon:hover{background:var(--bg);}
.ticon .dot{position:absolute; top:5px; right:5px; width:8px; height:8px; border-radius:50%; background:var(--danger); border:2px solid #fff;}
.install-btn{display:inline-flex; align-items:center; gap:6px; background:var(--accent); color:#3A2600; border:none; border-radius:9px; padding:8px 13px; font-size:12.5px; font-weight:700; cursor:pointer;}
.topbar-user{display:flex; align-items:center; gap:8px; padding:5px 10px 5px 5px; border-radius:20px; cursor:pointer; border:1px solid var(--line); background:#fff;}
.topbar-user:hover{background:var(--bg);}
.topbar-user .nm{font-size:12.5px; font-weight:600;}
.dropdown-panel{position:absolute; top:56px; right:26px; width:320px; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow-lg); z-index:50; overflow:hidden;}
.dropdown-panel .dp-head{padding:12px 16px; font-weight:700; border-bottom:1px solid var(--line); font-size:13px;}
.dropdown-panel .dp-body{max-height:340px; overflow-y:auto;}
.dp-item{padding:11px 16px; border-bottom:1px solid var(--line-soft); font-size:12.5px; cursor:pointer;}
.dp-item:hover{background:var(--bg);}
.dp-item .t{font-weight:600; color:var(--text);}
.dp-item .s{color:var(--muted); font-size:11.5px; margin-top:2px;}

/* ---------- alerta de horas semanales excedidas ---------- */
.alerta-horas-bar{position:sticky; top:0; z-index:35; box-shadow:0 4px 14px rgba(0,0,0,.15);}
.alerta-horas-item{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:11px 22px; font-size:12.5px; font-weight:600; color:#fff; border-bottom:1px solid rgba(255,255,255,.25); animation:alertaPulse 1.6s ease-in-out infinite;}
.alerta-horas-item span{line-height:1.4;}
.alerta-horas-item button{background:#fff; color:var(--danger); border:none; border-radius:7px; padding:7px 14px; font-weight:800; cursor:pointer; flex:0 0 auto; font-size:12px;}
.alerta-horas-item button:hover{background:var(--danger-soft);}
@keyframes alertaPulse{0%,100%{background:var(--danger);} 50%{background:#f16060;}}

.content{padding:24px 26px 60px; flex:1;}
.page-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:20px; gap:14px; flex-wrap:wrap;}
.page-head h1{font-size:22px;}
.page-head .subt{font-size:12.5px; color:var(--muted); margin-top:3px; font-weight:400; font-family:'Inter';}

/* ---------- basic elements ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}
.card-pad{padding:20px;}
.card-bar{background:linear-gradient(135deg,var(--primary),var(--primary-2)); color:#fff; padding:13px 20px; border-radius:var(--radius) var(--radius) 0 0; font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:14.5px; display:flex; align-items:center; justify-content:space-between;}
.section-title{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; gap:12px; flex-wrap:wrap;}
.section-title h2{font-size:16.5px;}
.section-title .hint{font-size:12.5px; color:var(--muted); font-family:'Inter'; font-weight:400;}

.grid{display:grid; gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:1100px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} }
@media (max-width:640px){ .grid-4,.grid-3,.grid-2{grid-template-columns:1fr;} }

.stat{padding:16px 18px; position:relative; overflow:hidden;}
.stat .lbl{font-size:12px; color:var(--muted); display:flex; justify-content:space-between; align-items:center;}
.stat .num{font-family:'Plus Jakarta Sans',sans-serif; font-size:26px; font-weight:800; margin-top:6px; color:var(--primary);}
.stat .sub{font-size:11.5px; color:var(--muted); margin-top:4px;}
.stat .icochip{width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:14px;}
.chip-blue{background:var(--primary-soft); color:var(--primary-2);}
.chip-amber{background:var(--accent-soft); color:var(--accent-deep);}
.chip-green{background:var(--success-soft); color:var(--success);}
.chip-red{background:var(--danger-soft); color:var(--danger);}
.chip-violet{background:var(--violet-soft); color:var(--violet);}
.chip-info{background:var(--info-soft); color:var(--info);}

.btn{
  display:inline-flex; align-items:center; gap:6px; padding:9px 15px; border-radius:9px; border:1px solid transparent;
  font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;
}
.btn-primary{background:var(--primary-2); color:#fff;}
.btn-primary:hover{background:var(--primary);}
.btn-accent{background:var(--accent); color:#3A2600;}
.btn-accent:hover{background:var(--accent-deep); color:#fff;}
.btn-ghost{background:transparent; border-color:var(--line); color:var(--text);}
.btn-ghost:hover{background:var(--bg);}
.btn-teal{background:var(--success); color:#fff;}
.btn-danger{background:transparent; border-color:var(--danger); color:var(--danger);}
.btn-danger:hover{background:var(--danger-soft);}
.btn-sm{padding:6px 11px; font-size:12px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.icon-btn{background:none; border:none; cursor:pointer; color:var(--muted); font-size:16px; line-height:1; padding:4px;}
.icon-btn:hover{color:var(--text);}

.field{margin-bottom:13px;}
.field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px; font-weight:500;}
.field input, .field select, .field textarea{
  width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--text);
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--primary-3);}
.field textarea{resize:vertical; min-height:70px;}
.field-row{display:flex; gap:12px;}
.field-row .field{flex:1;}
.check-row{display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:12px;}

table{width:100%; border-collapse:collapse; font-size:13px;}
thead th{
  text-align:left; font-size:11.5px; font-weight:700; color:var(--muted);
  padding:10px 12px; border-bottom:1px solid var(--line); background:var(--bg);
}
tbody td{padding:10px 12px; border-bottom:1px solid var(--line-soft); vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#FAFBFD;}
.table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:#fff;}
.num-cell{text-align:right; font-variant-numeric:tabular-nums;}
.tbl-input{width:60px; padding:5px 6px; border:1px solid var(--line); border-radius:6px; text-align:right; font-variant-numeric:tabular-nums;}

.pill{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:700;}
.pill-green{background:var(--success-soft); color:var(--success);}
.pill-amber{background:var(--accent-soft); color:var(--accent-deep);}
.pill-red{background:var(--danger-soft); color:var(--danger);}
.pill-blue{background:var(--primary-soft); color:var(--primary-2);}
.pill-gray{background:var(--line-soft); color:var(--muted);}
.pill-violet{background:var(--violet-soft); color:var(--violet);}

.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:18px; flex-wrap:wrap;}
.tabs button{background:none; border:none; padding:10px 15px; font-size:13px; color:var(--muted); cursor:pointer; border-bottom:2.5px solid transparent; margin-bottom:-1px; font-weight:600;}
.tabs button.active{color:var(--primary); border-bottom-color:var(--primary-2);}

.chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
.chip{border:1px solid var(--line); background:#fff; padding:6px 13px; border-radius:20px; font-size:12.5px; cursor:pointer; color:var(--muted); font-weight:500;}
.chip.active{background:var(--primary); color:#fff; border-color:var(--primary);}

.empty{padding:38px 20px; text-align:center; color:var(--muted);}
.empty .big{font-family:'Plus Jakarta Sans',sans-serif; font-size:16px; color:var(--primary); margin-bottom:6px; font-weight:700;}

/* hexagon avatars */
.hex{clip-path:polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0% 50%); background:var(--primary-3); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; flex:0 0 auto;}
.hex-sm{width:30px; height:30px; font-size:11px;}
.hex-md{width:44px; height:44px; font-size:14px;}
.hex-lg{width:88px; height:88px; font-size:26px;}
.hex-wrap{position:relative; display:inline-block;}
.hex-ring{padding:3px; background:var(--primary-soft); clip-path:polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0% 50%);}

.person{display:flex; align-items:center; gap:10px;}
.person .nm{font-weight:600; font-size:13px;}
.person .sub{font-size:11.5px; color:var(--muted);}

/* modal */
.modal-overlay{position:fixed; inset:0; background:rgba(15,23,50,.5); display:flex; align-items:flex-start; justify-content:center; padding:5vh 20px; z-index:100; overflow-y:auto;}
.modal{background:#fff; border-radius:14px; width:100%; max-width:560px; box-shadow:var(--shadow-lg);}
.modal.wide{max-width:780px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--line);}
.modal-head h3{font-size:16.5px;}
.modal-body{padding:20px; max-height:70vh; overflow-y:auto;}
.modal-foot{padding:14px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px;}

/* toast */
#toastRoot{position:fixed; bottom:22px; right:22px; z-index:200; display:flex; flex-direction:column; gap:8px;}
.toast{background:var(--primary); color:#fff; padding:11px 18px; border-radius:9px; font-size:13px; opacity:0; transform:translateY(8px); transition:opacity .25s, transform .25s; box-shadow:var(--shadow-lg);}
.toast.show{opacity:1; transform:translateY(0);}

/* ---------- check de confirmación (NFC) ---------- */
.check-overlay{position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; background:rgba(15,23,44,.4); backdrop-filter:blur(2px); opacity:0; transition:opacity .25s;}
.check-overlay.show{opacity:1;}
.check-overlay-card{background:#fff; border-radius:20px; padding:18px 32px 24px; box-shadow:var(--shadow-lg); display:flex; flex-direction:column; align-items:center; gap:4px; transform:scale(.9); transition:transform .25s;}
.check-overlay.show .check-overlay-card{transform:scale(1);}
.check-overlay-anim{width:150px; height:150px; border:none; pointer-events:none;}
.check-overlay-msg{font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; color:var(--success); font-size:15px; text-align:center; margin-top:-6px;}

/* comm center */
.comm-layout{display:grid; grid-template-columns:320px 1fr; gap:0; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:#fff; min-height:520px;}
.comm-list{border-right:1px solid var(--line); overflow-y:auto; max-height:640px;}
.comm-item{padding:12px 16px; border-bottom:1px solid var(--line-soft); cursor:pointer;}
.comm-item:hover{background:#FAFBFD;}
.comm-item.active{background:var(--primary-soft);}
.comm-item .top{display:flex; justify-content:space-between; gap:8px;}
.comm-item .nm{font-weight:700; font-size:13px;}
.comm-item .ch{font-size:10.5px; color:var(--muted);}
.comm-item .snip{font-size:12px; color:var(--muted); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.comm-item .unread{width:7px; height:7px; border-radius:50%; background:var(--accent); display:inline-block; margin-left:6px;}
.comm-thread{display:flex; flex-direction:column; height:100%;}
.comm-thread-head{padding:14px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
.comm-msgs{flex:1; padding:18px 20px; overflow-y:auto; max-height:460px; display:flex; flex-direction:column; gap:10px;}
.msg{max-width:70%; padding:9px 13px; border-radius:12px; font-size:13px;}
.msg.them{background:var(--line-soft); align-self:flex-start;}
.msg.us{background:var(--primary-2); color:#fff; align-self:flex-end;}
.msg .hora{display:block; font-size:10px; margin-top:4px; opacity:.7;}
.comm-reply{border-top:1px solid var(--line); padding:12px 16px; display:flex; gap:8px;}
.comm-reply textarea{flex:1; resize:none; height:42px; border:1px solid var(--line); border-radius:8px; padding:9px;}
.acct-chip{display:flex; align-items:center; gap:7px; border:1px solid var(--line); border-radius:20px; padding:6px 12px; font-size:12px;}
.acct-chip .ok{width:7px; height:7px; border-radius:50%; background:var(--success);}

/* signature pad */
.sigpad{border:1.5px dashed var(--line); border-radius:10px; background:#FAFBFD; touch-action:none; cursor:crosshair;}

/* bars */
.bar-row{margin-bottom:10px;}
.bar-row .bl{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px;}
.bar-track{background:var(--line-soft); border-radius:5px; height:10px; overflow:hidden;}
.bar-fill{background:var(--primary-2); height:100%; border-radius:5px;}
.bar-fill.green{background:var(--success);}
.bar-fill.amber{background:var(--accent);}

/* recognition cards */
.recog-card{background:#fff; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);}
.recog-head{padding:11px 16px; font-weight:700; font-size:13px; color:#fff;}
.recog-body{padding:14px 16px;}
.recog-title{font-weight:700; font-size:13.5px; margin-bottom:8px;}
.recog-msg{font-size:12.5px; color:var(--muted); border-left:2px solid var(--line); padding-left:9px; margin-bottom:7px;}
.recog-foot{display:flex; gap:16px; padding:10px 16px; border-top:1px solid var(--line-soft); font-size:12.5px; color:var(--muted);}
.recog-foot span{display:flex; align-items:center; gap:5px; cursor:pointer;}

/* benefit cards */
.benefit-card{border-radius:var(--radius); overflow:hidden; color:#fff; position:relative; min-height:150px; display:flex; flex-direction:column; justify-content:flex-end; padding:16px; box-shadow:var(--shadow);}
.benefit-card .pts{position:absolute; top:10px; right:10px; background:rgba(255,255,255,.22); backdrop-filter:blur(4px); border-radius:20px; padding:4px 10px; font-size:11px; font-weight:700;}
.benefit-card .emoji{font-size:26px; margin-bottom:6px;}
.benefit-card h4{color:#fff; font-size:15px; margin-bottom:4px;}
.benefit-card p{font-size:11.5px; opacity:.92; margin-bottom:10px;}
.benefit-card button{align-self:flex-start; background:#fff; color:var(--primary); border:none; border-radius:8px; padding:7px 13px; font-size:12px; font-weight:700; cursor:pointer;}

/* points badge */
.points-badge{display:flex; align-items:center; gap:8px; background:var(--accent-soft); color:var(--accent-deep); border-radius:20px; padding:8px 16px; font-size:13px; font-weight:700;}

/* mobile */
@media (max-width:900px){
  .sidebar{position:fixed; left:-270px; top:0; z-index:60; transition:left .25s; box-shadow:0 0 30px rgba(0,0,0,.3);}
  .sidebar.open{left:0;}
  .menu-toggle{display:inline-flex;}
  .content{padding:18px 16px 50px;}
  .topbar{padding:12px 16px;}
  .comm-layout{grid-template-columns:1fr;}
  .comm-list{max-height:220px;}
  .search-wrap{max-width:none;}
  .dropdown-panel{right:16px; width:calc(100vw - 32px);}
}
.hidden{display:none !important;}

/* ---------- Portal del colaborador / Kiosco de marcación ----------
   Estas dos pantallas viven en el mismo archivo que el panel del
   administrador; comparten la misma paleta y componentes (.card,
   .field, .btn, .pill, .table-wrap, .stat, .grid-2/4) y añaden solo
   lo que no existía todavía. */
.wrap{max-width:760px; margin:0 auto; padding:22px 16px 60px;}
.topbrand{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
.topbrand .mark{width:36px; height:36px; border-radius:9px; background:var(--primary); display:flex; align-items:center; justify-content:center; font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; color:#fff; font-size:16px;}
.topbrand .name{font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:17px; color:var(--primary);}
.topbrand .sub{font-size:11.5px; color:var(--muted); margin-top:1px;}
.btn-block{width:100%; justify-content:center;}
.pill-info{background:var(--info-soft); color:#0369A1;}
.back-link{display:inline-flex; align-items:center; gap:5px; color:var(--muted); font-size:12.5px; cursor:pointer; margin-bottom:14px; background:none; border:none; font-family:inherit; padding:0;}
.back-link:hover{color:var(--primary);}

.kiosk-status{width:100%; padding:26px; border-radius:16px; text-align:center; font-size:16px; font-weight:700; transition:background .2s,color .2s;}
.kiosk-status.idle{background:var(--primary-soft); color:var(--primary);}
.kiosk-status.ok{background:var(--success-soft); color:#15803D;}
.kiosk-status.err{background:var(--danger-soft); color:#B91C1C;}
.kiosk-clock{font-family:'Plus Jakarta Sans',sans-serif; font-size:44px; font-weight:800; color:var(--primary); text-align:center; margin:6px 0 2px;}
.kiosk-date{text-align:center; color:var(--muted); font-size:13px; margin-bottom:18px; text-transform:capitalize;}
.mode-tabs{display:flex; gap:8px; margin-bottom:16px;}
.mode-tabs button{flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:#fff; font-weight:700; font-size:12.5px; cursor:pointer; color:var(--muted);}
.mode-tabs button.active{background:var(--primary); color:#fff; border-color:var(--primary);}

.mode-select-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); padding:20px;}
.mode-select-card{max-width:440px; width:100%; text-align:center;}
.mode-select-card .brandbig{width:56px; height:56px; border-radius:14px; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:24px; margin:0 auto 14px;}
.mode-opt{display:flex; align-items:center; gap:12px; padding:14px 16px; border:1px solid var(--line); border-radius:12px; background:#fff; cursor:pointer; margin-top:10px; text-align:left;}
.mode-opt:hover{border-color:var(--primary-3); box-shadow:var(--shadow);}
.mode-opt .ico{width:38px; height:38px; border-radius:10px; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; font-size:18px; flex:0 0 auto;}
.mode-opt .t{font-weight:700; font-size:13.5px;}
.mode-opt .s{font-size:11.5px; color:var(--muted); margin-top:1px;}
</style>

<script>
/* =========================================================
   SUPABASE — conexión con la base de datos
   ========================================================= */
const SUPABASE_URL = 'https://hkszdgfdnffgsvmxqgwd.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhrc3pkZ2ZkbmZmZ3N2bXhxZ3dkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NjIxNjUsImV4cCI6MjEwNTAzODE2NX0.fNEXV5Y1_FQT-0kpVkjhUtFxoRZQhSMJxZjtSX4MZ1w';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* Esta pantalla es la del ADMINISTRADOR. Las mismas credenciales
   (URL + anon key) las usan también /colaboradores/index.html
   (portal del colaborador) y /marcacion/index.html (kiosco de
   ingreso/salida por NFC o biometría), así los tres quedan
   conectados a la misma base de datos en Supabase. */

function empRowToApp(r){
  let horarioPropio = null;
  try{ horarioPropio = r.horario_propio? (typeof r.horario_propio==='string'? JSON.parse(r.horario_propio) : r.horario_propio) : null; }catch(_e){ horarioPropio = null; }
  return { id:r.id, nombre:r.nombre, cedula:r.cedula, cargo:r.cargo, area:r.area,
    contrato:r.contrato, ingreso:r.ingreso, salario:Number(r.salario)||0, estado:r.estado,
    email:r.email||'', tel:r.tel||'', supervisor:r.supervisor||'', huella:!!r.huella, puntos:r.puntos||0,
    turnoId:r.turno_id||null, horarioPropio };
}
function empAppToRow(e){
  return { id:e.id, nombre:e.nombre, cedula:e.cedula, cargo:e.cargo, area:e.area,
    contrato:e.contrato, ingreso:e.ingreso, salario:e.salario, estado:e.estado,
    email:e.email, tel:e.tel, supervisor:e.supervisor, huella:e.huella, puntos:e.puntos,
    turno_id:e.turnoId||null, horario_propio: e.horarioPropio? JSON.stringify(e.horarioPropio) : null };
}
function attRowToApp(r){
  /* "marcas" guarda TODOS los ingresos/salidas del día (permite más de un
     ciclo diario). Se serializa como JSON en una columna de Supabase; si esa
     columna todavía no existe en tu base de datos, se reconstruye a partir
     de entrada/salida (comportamiento anterior, un solo ciclo). */
  let marcas = [];
  try{ marcas = r.marcas? (typeof r.marcas==='string'? JSON.parse(r.marcas) : r.marcas) : []; }catch(_e){ marcas = []; }
  if(!marcas.length){ if(r.entrada) marcas.push({hora:r.entrada, tipo:'Entrada'}); if(r.salida) marcas.push({hora:r.salida, tipo:'Salida'}); }
  return { id:r.id, empId:r.empleado_id, fecha:r.fecha, entrada:r.entrada, salida:r.salida, estado:r.estado, metodo:r.metodo, marcas };
}
/* Todas las funciones sb* devuelven `true` si se guardó bien, o el mensaje de
   error (string) si falló — así quien llama puede mostrarle al usuario el
   motivo exacto (tabla que no existe, columna que falta, RLS que bloquea,
   etc.) en vez de un genérico "falló el guardado" sin más detalle. */
async function sbGuardarEmpleado(e){
  try{
    let row = empAppToRow(e);
    let {error} = await sb.from('empleados').upsert(row);
    if(error && /turno_id|horario_propio/i.test(error.message||'')){
      /* Las columnas "turno_id" (texto) y "horario_propio" (jsonb) todavía no
         existen en tu tabla "empleados" de Supabase. Se reintenta sin ellas
         para no perder el resto de la ficha; agrégalas para que el horario
         laboral configurado por colaborador quede guardado entre sesiones. */
      delete row.turno_id; delete row.horario_propio;
      ({error} = await sb.from('empleados').upsert(row));
    }
    if(error){ console.warn('Supabase (empleados):', error.message); return error.message; } return true;
  } catch(err){ console.warn('Supabase no disponible:', err.message); return err.message; }
}
async function sbActualizarEstadoEmpleado(id, estado){
  try{ const {error} = await sb.from('empleados').update({estado}).eq('id', id); if(error){ console.warn('Supabase (empleados):', error.message); return error.message; } return true; }
  catch(err){ console.warn('Supabase no disponible:', err.message); return err.message; }
}
async function sbGuardarParametros(cfg){
  try{
    const row = { id:1, smmlv:cfg.smmlv, aux_transporte:cfg.auxTransporte, salud_pct:cfg.saludPct, pension_pct:cfg.pensionPct,
      horas_mes:cfg.horasMes, r_hed:cfg.rHED, r_hen:cfg.rHEN, r_hefd:cfg.rHEFD, r_hefn:cfg.rHEFN,
      pct_cesantias:cfg.pctCesantias, pct_intereses_cesantias:cfg.pctIntCesantias, pct_prima:cfg.pctPrima, pct_vacaciones:cfg.pctVacaciones,
      pct_arl:cfg.pctArl, pct_caja_compensacion:cfg.pctCaja, pct_sena:cfg.pctSena, pct_icbf:cfg.pctIcbf,
      pct_salud_empleador:cfg.pctSaludPatronal, pct_pension_empleador:cfg.pctPensionPatronal, exoneracion_aportes:cfg.exoneracion,
      horas_semanales_max:cfg.horasSemanalesMax,
      company_name:cfg.companyName, company_nit:cfg.companyNit };
    let {error} = await sb.from('parametros').upsert(row);
    if(error && /horas_semanales_max/i.test(error.message||'')){
      /* La columna "horas_semanales_max" todavía no existe en la tabla
         "parametros" de Supabase; se reintenta sin ella. Agrégala (tipo
         numérico) para que el límite legal de jornada quede guardado. */
      delete row.horas_semanales_max;
      ({error} = await sb.from('parametros').upsert(row));
    }
    if(error){ console.warn('Supabase (parametros):', error.message); return error.message; } return true;
  } catch(err){ console.warn('Supabase no disponible:', err.message); return err.message; }
}
async function sbRegistrarMarcacion(rec){
  try{
    const row = { id:rec.id, empleado_id:rec.empId, fecha:rec.fecha, entrada:rec.entrada, salida:rec.salida, estado:rec.estado, metodo:rec.metodo||'Manual', marcas: JSON.stringify(rec.marcas||[]) };
    let {error} = await sb.from('asistencia').upsert(row);
    if(error && /marcas/i.test(error.message||'')){
      /* La columna "marcas" (tipo texto o jsonb) todavía no existe en la
         tabla "asistencia" de Supabase. Se reintenta sin ella para no perder
         el resto del registro; agrega esa columna para guardar el historial
         completo de ingresos/salidas del día entre sesiones. */
      delete row.marcas;
      ({error} = await sb.from('asistencia').upsert(row));
    }
    if(error){ console.warn('Supabase (asistencia):', error.message); return error.message; }
    return true;
  } catch(err){ console.warn('Supabase no disponible:', err.message); return err.message; }
}
async function sbBorrarTodosLosEmpleados(){
  const {error} = await sb.from('empleados').delete().not('id','is', null);
  if(error) throw error;
  /* Sin esto, todo lo que dependía de esos colaboradores se queda en Supabase
     apuntando a un empleado_id que ya no existe: asistencia, solicitudes de
     vacaciones/permisos, huellas del kiosco, objetivos, documentos firmados,
     reconocimientos, solicitudes de beneficios y adelantos. Al recargar, esos
     registros "fantasma" vuelven a aparecer y pueden romper el render de esas
     pestañas. Los activos NO se borran (son propiedad de la empresa): solo se
     liberan (quedan "Disponible", sin asignar). Se usa allSettled para que si
     alguna tabla todavía no existe en tu proyecto, el resto sí se limpie. */
  await Promise.allSettled([
    sb.from('asistencia').delete().not('id','is', null),
    sb.from('solicitudes').delete().not('id','is', null),
    sb.from('huellas').delete().not('credential_id','is', null),
    sb.from('objetivos').delete().not('id','is', null),
    sb.from('documentos').delete().not('id','is', null),
    sb.from('reconocimientos').delete().not('id','is', null),
    sb.from('beneficio_solicitudes').delete().not('id','is', null),
    sb.from('adelantos').delete().not('id','is', null),
    sb.from('activos').update({estado:'Disponible', asignado_a:null, fecha:null}).not('asignado_a','is', null),
  ]);
}
/* Solicitudes (permisos y vacaciones) — usadas tanto por el admin
   (DB.leaveRequests) como por el portal del colaborador. */
function solRowToApp(r){
  const dias = Math.max(1, Math.round((new Date(r.fecha_fin)-new Date(r.fecha_inicio))/86400000)+1);
  return { id:r.id, empId:r.empleado_id, tipo:r.tipo, inicio:r.fecha_inicio, fin:r.fecha_fin, dias, motivo:r.motivo||'', estado:r.estado };
}
function solAppToRow(l){
  return { id:l.id, empleado_id:l.empId, tipo:l.tipo, fecha_inicio:l.inicio, fecha_fin:l.fin, motivo:l.motivo, estado:l.estado };
}
async function sbGuardarSolicitud(l){
  try{ const {error} = await sb.from('solicitudes').upsert(solAppToRow(l)); if(error){ console.warn('Supabase (solicitudes):', error.message); return error.message; } return true; }
  catch(err){ console.warn('Supabase no disponible:', err.message); return err.message; }
}
async function sbActualizarSolicitud(id, estado){
  try{ const {error} = await sb.from('solicitudes').update({estado}).eq('id', id); if(error){ console.warn('Supabase (solicitudes):', error.message); return error.message; } return true; }
  catch(err){ console.warn('Supabase no disponible:', err.message); return err.message; }
}
/* Huellas (credenciales WebAuthn registradas desde el kiosco) */
async function sbGuardarHuella(h){
  try{ const {error} = await sb.from('huellas').upsert(h, {onConflict:'credential_id'}); if(error){ console.warn('Supabase (huellas):', error.message); return error.message; } return true; }
  catch(err){ console.warn('Supabase no disponible:', err.message); return err.message; }
}
/* Activos (inventario y asignación a colaboradores) */
function assetRowToApp(r){
  return { id:r.id, nombre:r.nombre, categoria:r.categoria, tipo:r.tipo, identificador:r.identificador,
    estado:r.estado, asignadoA:r.asignado_a||null, fecha:r.fecha||null, valor:Number(r.valor)||0 };
}
function assetAppToRow(a){
  return { id:a.id, nombre:a.nombre, categoria:a.categoria, tipo:a.tipo, identificador:a.identificador,
    estado:a.estado, asignado_a:a.asignadoA, fecha:a.fecha, valor:a.valor };
}
async function sbGuardarActivo(a){
  try{ const {error} = await sb.from('activos').upsert(assetAppToRow(a)); if(error){ console.warn('Supabase (activos):', error.message); return error.message; } return true; }
  catch(err){ console.warn('Supabase no disponible:', err.message); return err.message; }
}
/* Turnos (plantillas de horario reutilizables, continuas o segmentadas) */
function turnoRowToApp(r){
  let horario = null;
  try{ horario = r.horario? (typeof r.horario==='string'? JSON.parse(r.horario) : r.horario) : null; }catch(_e){ horario = null; }
  return { id:r.id, nombre:r.nombre, dias:r.dias, horario };
}
function turnoAppToRow(t){
  return { id:t.id, nombre:t.nombre, dias:t.dias, horario: JSON.stringify(t.horario||{}) };
}
async function sbGuardarTurno(t){
  try{ const {error} = await sb.from('turnos').upsert(turnoAppToRow(t)); if(error){ console.warn('Supabase (turnos):', error.message); return error.message; } return true; }
  catch(err){ console.warn('Supabase no disponible:', err.message); return err.message; }
}
async function sbBorrarTurno(id){
  try{ const {error} = await sb.from('turnos').delete().eq('id', id); if(error){ console.warn('Supabase (turnos):', error.message); return error.message; } return true; }
  catch(err){ console.warn('Supabase no disponible:', err.message); return err.message; }
}
/* Reconocimientos (muro de reconocimientos entre colaboradores) */
function recogRowToApp(r){
  let comentarios = [];

  return { id:r.id, categoria:r.categoria, color:r.color, de:r.de_id, para:r.para_id, mensaje:r.mensaje, fecha:r.fecha, likes:r.likes||0, comentarios };

function recogAppToRow(r){

}
async function sbGuardarReconocimiento(r){
  try{ const {error} = await sb.from('reconocimientos').upsert(recogAppToRow(r)); if(error){ console.warn('Supabase (reconocimientos):', error.message); return error.message; } return true; }
  catch(err){ console.warn('Supabase no disponible:', err.message); return err.message; }
}
/* Objetivos (organizacionales y personales) */
function objRowToApp(r){
  return { id:r.id, empId:r.empleado_id, tipo:r.tipo, descripcion:r.descripcion, meta:r.meta, peso:Number(r.peso)||0, avance:Number(r.avance)||0,
    fechaTermino:r.fecha_termino, activo:!!r.activo, aprobado:!!r.aprobado, fechaAprobacion:r.fecha_aprobacion||null, creadoPor:r.creado_por||'' };
}
function objAppToRow(o){
  return { id:o.id, empleado_id:o.empId, tipo:o.tipo, descripcion:o.descripcion, meta:o.meta, peso:o.peso, avance:o.avance,
    fecha_termino:o.fechaTermino, activo:o.activo, aprobado:o.aprobado, fecha_aprobacion:o.fechaAprobacion, creado_por:o.creadoPor };
}
async function sbGuardarObjetivo(o){
  try{ const {error} = await sb.from('objetivos').upsert(objAppToRow(o)); if(error){ console.warn('Supabase (objetivos):', error.message); return error.message; } return true; }
  catch(err){ console.warn('Supabase no disponible:', err.message); return err.message; }

async function sbBorrarObjetivo(id){
  try{ const {error} = await sb.from('objetivos').delete().eq('id', id); if(error){ console.warn('Supabase (objetivos):', error.message); return error.message; } return true; }
  catch(err){ console.warn('Supabase no disponible:', err.message); return err.message; }

/* Documentos y firma electrónica */
function docRowToApp(r){
  return { id:r.id, empId:r.empleado_id, nombre:r.nombre, tipo:r.tipo, fecha:r.fecha, estado:r.estado, firmante:r.firmante||null, firmaFecha:r.firma_fecha||null };
}
function docAppToRow(d){
  return { id:d.id, empleado_id:d.empId, nombre:d.nombre, tipo:d.tipo, fecha:d.fecha, estado:d.estado, firmante:d.firmante, firma_fecha:d.firmaFecha };
}
async function sbGuardarDocumento(d){
  try{ const {error} = await sb.from('documentos').upsert(docAppToRow(d)); if(error){ console.warn('Supabase (documentos):', error.message); return error.message; } return true; }
  catch(err){ console.warn('Supabase no disponible:', err.message); return err.message; }
}
/* Canal de denuncias */
function cplRowToApp(r){
  let comentarios = [];
  try{ comentarios = r.comentarios? (typeof r.comentarios==='string'? JSON.parse(r.comentarios) : r.comentarios) : []; }catch(_e){ comentarios = []; }
  return { id:r.id, folio:r.folio, fecha:r.fecha, categoria:r.categoria, relacion:r.relacion, anonimo:!!r.anonimo, nombre:r.nombre||null, email:r.email||null,
    descripcion:r.descripcion, estado:r.estado, prioridad:r.prioridad, comentarios };
}
function cplAppToRow(c){
  return { id:c.id, folio:c.folio, fecha:c.fecha, categoria:c.categoria, relacion:c.relacion, anonimo:c.anonimo, nombre:c.nombre, email:c.email,
    descripcion:c.descripcion, estado:c.estado, prioridad:c.prioridad, comentarios: JSON.stringify(c.comentarios||[]) };
}
async function sbGuardarDenuncia(c){
  try{ const {error} = await sb.from('denuncias').upsert(cplAppToRow(c)); if(error){ console.warn('Supabase (denuncias):', error.message); return error.message; } return true; }
  catch(err){ console.warn('Supabase no disponible:', err.message); return err.message; }
}
/* Encuestas de clima */
function svyRowToApp(r){
  let preguntas=[], respuestas=[];
  try{ preguntas = r.preguntas? (typeof r.preguntas==='string'? JSON.parse(r.preguntas) : r.preguntas) : []; }catch(_e){ preguntas=[]; }
  try{ respuestas = r.respuestas? (typeof r.respuestas==='string'? JSON.parse(r.respuestas) : r.respuestas) : []; }catch(_e){ respuestas=[]; }
  return { id:r.id, titulo:r.titulo, descripcion:r.descripcion||'', estado:r.estado, creada:r.creada, preguntas, respuestas };
}
function svyAppToRow(s){
  return { id:s.id, titulo:s.titulo, descripcion:s.descripcion, estado:s.estado, creada:s.creada, preguntas: JSON.stringify(s.preguntas||[]), respuestas: JSON.stringify(s.respuestas||[]) };
}
async function sbGuardarEncuesta(s){
  try{ const {error} = await sb.from('encuestas').upsert(svyAppToRow(s)); if(error){ console.warn('Supabase (encuestas):', error.message); return error.message; } return true; }

async function cargarDesdeSupabase(){
  const tablasFaltantes = []; // se acumulan aquí las tablas que no se pudieron leer, para un solo aviso al final
  try{
    const [
      {data:emps, error:e1}, {data:atts, error:e2}, {data:par, error:e3}, {data:sols, error:e4},
      {data:huellasData, error:e5}, {data:activosData, error:e6}, {data:recogData, error:e7},
      {data:objData, error:e8}, {data:docData, error:e9}, {data:cplData, error:e10},
      {data:svyData, error:e11}, {data:brData, error:e12}, {data:advData, error:e13}, {data:runData, error:e14},
      {data:turnosData, error:e15},
    ] = await Promise.all([
      sb.from('empleados').select('*'), sb.from('asistencia').select('*'), sb.from('parametros').select('*').eq('id',1).maybeSingle(),
      sb.from('solicitudes').select('*'), sb.from('huellas').select('*'), sb.from('activos').select('*'),
      sb.from('reconocimientos').select('*'), sb.from('objetivos').select('*'), sb.from('documentos').select('*'),
      sb.from('denuncias').select('*'), sb.from('encuestas').select('*'), sb.from('beneficio_solicitudes').select('*'),
      sb.from('adelantos').select('*'), sb.from('nomina_runs').select('*'), sb.from('turnos').select('*'),
    ]);
    if(!e1 && emps){ DB.empleados = emps.map(empRowToApp); }
    else if(e1){ console.warn('Supabase (empleados):', e1.message); toast('⚠️ No se pudieron cargar los colaboradores desde la base de datos: '+e1.message); }
    if(!e2 && atts){ DB.attendance = atts.map(attRowToApp); }
    else if(e2){ console.warn('Supabase (asistencia):', e2.message); }
    if(!e4 && sols){ DB.leaveRequests = sols.map(solRowToApp); }
    else if(e4){ console.warn('Supabase (solicitudes):', e4.message); }
    if(!e5 && huellasData){ DB.huellas = huellasData; }
    else if(e5){ console.warn('Supabase (huellas):', e5.message); }
    if(!e6 && activosData){ DB.assets = activosData.map(assetRowToApp); }
    else if(e6){ console.warn('Supabase (activos):', e6.message); toast('⚠️ No se pudo cargar el inventario de activos desde la base de datos: '+e6.message); }
    if(!e7 && recogData){ DB.recognitions = recogData.map(recogRowToApp); }
    else if(e7){ console.warn('Supabase (reconocimientos):', e7.message); tablasFaltantes.push('reconocimientos'); }
    if(!e8 && objData){ DB.objectives = objData.map(objRowToApp); }
    else if(e8){ console.warn('Supabase (objetivos):', e8.message); tablasFaltantes.push('objetivos'); }
    if(!e9 && docData){ DB.documents = docData.map(docRowToApp); }
    else if(e9){ console.warn('Supabase (documentos):', e9.message); tablasFaltantes.push('documentos'); }
    if(!e10 && cplData){ DB.complaints = cplData.map(cplRowToApp); }
    else if(e10){ console.warn('Supabase (denuncias):', e10.message); tablasFaltantes.push('denuncias'); }
    if(!e11 && svyData){ DB.surveys = svyData.map(svyRowToApp); }
    else if(e11){ console.warn('Supabase (encuestas):', e11.message); tablasFaltantes.push('encuestas'); }
    if(!e12 && brData){ DB.benefitRequests = brData.map(brRowToApp); }
    else if(e12){ console.warn('Supabase (beneficio_solicitudes):', e12.message); tablasFaltantes.push('beneficio_solicitudes'); }
    if(!e13 && advData){ DB.advances = advData.map(advRowToApp); }
    else if(e13){ console.warn('Supabase (adelantos):', e13.message); tablasFaltantes.push('adelantos'); }
    if(!e14 && runData){ DB.payrollRuns = runData.map(runRowToApp); }
    else if(e14){ console.warn('Supabase (nomina_runs):', e14.message); tablasFaltantes.push('nomina_runs'); }
    if(!e15 && turnosData){ DB.shifts = turnosData.map(turnoRowToApp); }
    else if(e15){ console.warn('Supabase (turnos):', e15.message); tablasFaltantes.push('turnos (se muestran los turnos de ejemplo por ahora)'); }
    if(!e3 && par){
      Object.assign(CFG, { smmlv:Number(par.smmlv)||CFG.smmlv, auxTransporte:Number(par.aux_transporte)||0,
        saludPct:Number(par.salud_pct)||0, pensionPct:Number(par.pension_pct)||0, horasMes:Number(par.horas_mes)||230,
        rHED:Number(par.r_hed)||0, rHEN:Number(par.r_hen)||0, rHEFD:Number(par.r_hefd)||0, rHEFN:Number(par.r_hefn)||0,
        pctCesantias:Number(par.pct_cesantias)||CFG.pctCesantias, pctIntCesantias:Number(par.pct_intereses_cesantias)||CFG.pctIntCesantias,
        pctPrima:Number(par.pct_prima)||CFG.pctPrima, pctVacaciones:Number(par.pct_vacaciones)||CFG.pctVacaciones,
        pctArl:Number(par.pct_arl)||CFG.pctArl, pctCaja:Number(par.pct_caja_compensacion)||CFG.pctCaja,
        pctSena:Number(par.pct_sena)||CFG.pctSena, pctIcbf:Number(par.pct_icbf)||CFG.pctIcbf,
        pctSaludPatronal:Number(par.pct_salud_empleador)||CFG.pctSaludPatronal, pctPensionPatronal:Number(par.pct_pension_empleador)||CFG.pctPensionPatronal,
        exoneracion: par.exoneracion_aportes!==null? !!par.exoneracion_aportes : CFG.exoneracion,
        horasSemanalesMax:Number(par.horas_semanales_max)||CFG.horasSemanalesMax,
        companyName: par.company_name||CFG.companyName, companyNit: par.company_nit||CFG.companyNit });
    } else if(e3){ console.warn('Supabase (parametros):', e3.message); }
    if(tablasFaltantes.length){
      /* Estas tablas todavía no existen en tu proyecto de Supabase (o el anon key
         no tiene permiso sobre ellas). Mientras no las crees, lo que se registre
         en esas pestañas se ve bien en pantalla pero se pierde al recargar.
         Revisa la consola del navegador para el detalle de cada tabla y crea el
         esquema SQL correspondiente en Supabase. */
      toast('⚠️ Estas tablas no existen aún en Supabase, así que no se guardan entre sesiones: '+tablasFaltantes.join(', '));
    }
  } catch(err){
    console.warn('No se pudo conectar a Supabase:', err.message);
    toast('⚠️ No se pudo conectar a la base de datos: '+err.message);
  }
}

function $(sel,ctx=document){return ctx.querySelector(sel);}
function $all(sel,ctx=document){return [...ctx.querySelectorAll(sel)];}
function emp(id){return DB.empleados.find(e=>e.id===id);}
/* Nombre "seguro" de un colaborador: si el id ya no existe (por ejemplo, un
   activo, documento, objetivo o reconocimiento que sigue apuntando a alguien
   que fue eliminado — un "dato fantasma"), evita que se rompa el render de
   toda la pestaña y en su lugar muestra un texto claro. */
function empNombre(id){ const e=emp(id); return e? e.nombre : '(colaborador eliminado)'; }
function iniciales(nombre){return nombre.split(' ').filter(Boolean).slice(0,2).map(p=>p[0]).join('').toUpperCase();}
function apellidosDe(nombre){const p=nombre.split(' ').filter(Boolean); return p.slice(-2).join(' ');}
function nombresDe(nombre){const p=nombre.split(' ').filter(Boolean); return p.slice(0,Math.max(1,p.length-2)).join(' ');}
function fmtCOP(n){return (n||0).toLocaleString('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0});}
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'});}
function fmtDateTime(iso){ const d=new Date(iso); return d.toLocaleString('es-CO',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}
function uid(kind){ return kind+(DB.seq[kind]++); }
function hexAvatar(empId, size){
  const e = emp(empId); if(!e) return '';
  size = size||'md';
  return `<div class="hex hex-${size}">${iniciales(e.nombre)}</div>`;
}

function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  $('#toastRoot').appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  /* Los mensajes de error ahora incluyen el detalle real de Supabase y son
     más largos, así que el tiempo en pantalla escala con el largo del texto
     (2.6s para un aviso corto, hasta 8s para uno con el detalle del error). */
  const duracion = Math.min(8000, Math.max(2600, msg.length*55));
  setTimeout(()=>{t.classList.remove('show'); setTimeout(()=>t.remove(),300);},duracion);
}
/* Animación de confirmación (check) para marcaciones NFC exitosas y para la
   asignación de un tag NFC. Se muestra un par de segundos y se retira sola. */
function mostrarCheckExito(mensaje){
  const root = document.createElement('div');
  root.className = 'check-overlay';
  root.innerHTML = `
    <div class="check-overlay-card">
      <iframe class="check-overlay-anim" src="https://lottie.host/embed/312f68b9-b13e-4f56-89ec-3c1dd9fc8522/o7zwnccNM9.lottie" title="Confirmado" frameborder="0"></iframe>
      ${mensaje? `<div class="check-overlay-msg">${mensaje}</div>` : ''}
    </div>`;
  document.body.appendChild(root);
  requestAnimationFrame(()=>root.classList.add('show'));
  setTimeout(()=>{ root.classList.remove('show'); setTimeout(()=>root.remove(), 300); }, 2000);
}

        ${footHtml? `<div class="modal-foot">${footHtml}</div>` : ''}
      </div>
    </div>`;
}

/* =========================================================
   HORAS TRABAJADAS Y JORNADA SEMANAL MÁXIMA (Ley 2101 de 2021)
   Un registro de asistencia (DB.attendance) ahora puede tener
   varios ciclos de entrada/salida en el mismo día (rec.marcas).
   Estas funciones calculan las horas efectivamente laboradas por
   día y por semana a partir de esas marcaciones.
   ========================================================= */
function marcasDeRegistro(rec){
  if(rec.marcas && rec.marcas.length) return rec.marcas;
  const m=[]; if(rec.entrada) m.push({hora:rec.entrada, tipo:'Entrada'}); if(rec.salida) m.push({hora:rec.salida, tipo:'Salida'}); return m;
}
function horaAMinutos(hstr){ if(!hstr) return null; const p=hstr.split(':'); return (Number(p[0])||0)*60 + (Number(p[1])||0); }

/* ---------------------------------------------------------
   HORARIOS LABORALES (continuos o segmentados con descanso)
   Un "horario" tiene esta forma:
     {tipo:'continuo', inicio:'08:00', fin:'17:00', toleranciaMin:5}
     {tipo:'segmentado', bloques:[{inicio,fin},{inicio,fin},...], toleranciaMin:5}
   Un colaborador lo obtiene de su horario personalizado (e.horarioPropio,
   tiene prioridad) o del turno que tenga asignado (e.turnoId -> DB.shifts).
   Si no tiene ninguno de los dos, no hay horario definido para él.
   --------------------------------------------------------- */
function horarioDeEmpleado(e){
  if(!e) return null;
  if(e.horarioPropio) return e.horarioPropio;
  if(e.turnoId){ const t = DB.shifts.find(s=>s.id===e.turnoId); if(t && t.horario) return t.horario; }
  return null;
}
function bloquesHorario(h){
  if(!h) return [];
  if(h.tipo==='segmentado') return (h.bloques||[]).filter(b=>b && b.inicio && b.fin);
  return (h.inicio && h.fin)? [{inicio:h.inicio, fin:h.fin}] : [];
}
function horasEsperadasHorario(h){
  return bloquesHorario(h).reduce((s,b)=> s + Math.max(0, horaAMinutos(b.fin)-horaAMinutos(b.inicio))/60, 0);
}
function formatoHorario(h){
  const bloques = bloquesHorario(h);
  if(!bloques.length) return 'Sin definir';
  const txt = bloques.map(b=>`${b.inicio}–${b.fin}`).join(' y ');
  return `${h.tipo==='segmentado'? 'Segmentada':'Continua'}: ${txt} (${horasEsperadasHorario(h).toFixed(1)}h/día)`;
}
/* Evalúa si una marcación de "Entrada" fue tardía, según cuál de los bloques
   del horario le corresponde (numEntrada: 1 = primera entrada del día — la de
   la mañana —, 2 = segunda — el regreso del almuerzo en una jornada
   segmentada —, etc.). Devuelve null si el colaborador no tiene horario
   definido, para que quien llama decida un valor por defecto. */
function evaluarEntrada(e, horaStr, numEntrada){
  const h = horarioDeEmpleado(e);
  const bloques = bloquesHorario(h);
  if(!bloques.length) return null;
  const bloque = bloques[Math.min(Math.max(numEntrada,1)-1, bloques.length-1)];
  const tolerancia = (h.toleranciaMin!=null)? h.toleranciaMin : 5;
  return horaAMinutos(horaStr) > (horaAMinutos(bloque.inicio)+tolerancia) ? 'Tarde' : 'A tiempo';
}
function horasDeRegistro(rec){
  const marcas = marcasDeRegistro(rec).slice().sort((a,b)=>horaAMinutos(a.hora)-horaAMinutos(b.hora));
  let total=0, abierta=null;
  marcas.forEach(m=>{
    if(m.tipo==='Entrada'){ abierta = m.hora; }
    else if(m.tipo==='Salida' && abierta!=null){
      let mins = horaAMinutos(m.hora) - horaAMinutos(abierta);
      if(mins<0) mins += 24*60; // cruce de medianoche
      total += mins/60; abierta = null;
    }
  });
  return { horas: total, abierta };
}
function inicioSemanaISO(fechaISO){
  const d = new Date(fechaISO+'T00:00:00'); const dow = d.getDay(); const diff = dow===0? -6 : 1-dow;
  d.setDate(d.getDate()+diff); return d.toISOString().slice(0,10);
}
function finSemanaISO(inicioISO){ const d=new Date(inicioISO+'T00:00:00'); d.setDate(d.getDate()+6); return d.toISOString().slice(0,10); }
function horasSemanaEmpleado(empId, fechaRef){
  const ini = inicioSemanaISO(fechaRef), fin = finSemanaISO(ini);
  return DB.attendance.filter(a=>a.empId===empId && a.fecha>=ini && a.fecha<=fin)
    .reduce((sum,a)=> sum + horasDeRegistro(a).horas, 0);
}

/* ---------------------------------------------------------
   ALARMA SONORA: cuando un colaborador supera las horas
   semanales reglamentadas, se dispara una voz que repite
   "Revisar tiempo laboral de <nombre>" cada pocos segundos y
   no se detiene hasta que el administrador presiona "Ya revisé".
   --------------------------------------------------------- */
let _alarmaHorasInterval = null;
function alertasHorasPendientes(){ return Object.entries(state.alertasHoras).filter(([_,a])=>!a.revisado); }
function verificarAlertaHoras(e){
  if(!e || e.estado!=='Activo') return;
  const limite = CFG.horasSemanalesMax||42;
  const horas = horasSemanaEmpleado(e.id, DEMO_TODAY);
  const key = e.id+'_'+inicioSemanaISO(DEMO_TODAY);
  if(horas > limite){
    const existente = state.alertasHoras[key];
    if(!existente){
      state.alertasHoras[key] = { empId:e.id, nombre:e.nombre, horas:Math.round(horas*10)/10, limite, revisado:false };
      iniciarAlarmaHoras();
    } else if(!existente.revisado){
      existente.horas = Math.round(horas*10)/10; // mantiene el conteo actualizado mientras no se revise
    }
  }
  renderAlertasHorasBanner();
}
function verificarTodasLasAlertasHoras(){ DB.empleados.filter(e=>e.estado==='Activo').forEach(verificarAlertaHoras); }
function iniciarAlarmaHoras(){
  if(_alarmaHorasInterval) return; // ya está sonando
  hablarAlertaHoras();
  _alarmaHorasInterval = setInterval(hablarAlertaHoras, 8000);
}
function detenerAlarmaHorasSiNoHayPendientes(){
  if(!alertasHorasPendientes().length && _alarmaHorasInterval){ clearInterval(_alarmaHorasInterval); _alarmaHorasInterval=null; if('speechSynthesis' in window) speechSynthesis.cancel(); }
}
function hablarAlertaHoras(){
  const pendientes = alertasHorasPendientes();
  if(!pendientes.length){ detenerAlarmaHorasSiNoHayPendientes(); return; }
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  pendientes.forEach(([_,a], i)=>{
    const u = new SpeechSynthesisUtterance(`Revisar tiempo laboral de ${a.nombre}`);
    u.lang='es-CO'; u.rate=0.95; u.pitch=1;
    setTimeout(()=>{ try{ speechSynthesis.speak(u); }catch(_e){} }, i*2600);
  });
}
function revisarAlertaHoras(key){
  if(state.alertasHoras[key]) state.alertasHoras[key].revisado = true;
  detenerAlarmaHorasSiNoHayPendientes();
  renderAlertasHorasBanner();
}
function renderAlertasHorasBanner(){
  const root = $('#alertaHorasRoot'); if(!root) return;
  const pendientes = alertasHorasPendientes();
  if(!pendientes.length){ root.innerHTML=''; return; }
  root.innerHTML = `<div class="alerta-horas-bar">${pendientes.map(([key,a])=>`
    <div class="alerta-horas-item">
      <span>🔊 <strong>${a.nombre}</strong> superó la jornada semanal máxima permitida (${a.limite}h según la Ley 2101) — lleva <strong>${a.horas}h</strong> esta semana.</span>
      <button onclick="revisarAlertaHoras('${key}')">Ya revisé</button>
    </div>`).join('')}</div>`;
}

/* =========================================================
   EXPORTACIÓN CSV (usado por Reportes y por varios módulos)
   ========================================================= */
function exportCSV(filename, headers, rows){
  const esc = v => `"${String(v??'').replace(/"/g,'""')}"`;
  const csv = [headers.map(esc).join(','), ...rows.map(r=>r.map(esc).join(','))].join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

/* Graba la cédula del colaborador (tomada del formulario, aunque aún no se
   haya guardado) en un tag NFC físico. El kiosco de marcación (kioscoEscanearNFC)
   lee ese mismo valor para identificar al colaborador al marcar ingreso/salida. */
/* Controla que solo haya una escritura NFC activa a la vez: si el usuario
   presiona el botón de nuevo mientras hay una escritura pendiente (esperando
   que acerque el tag), Chrome cancela la anterior con el error "Push is
   cancelled due to a new push request". Por eso cancelamos cualquier
   escritura previa antes de iniciar una nueva, y deshabilitamos el botón
   mientras está en curso para que no se pueda disparar dos veces seguidas. */
let _nfcWriteController = null;
async function asignarTagNFC(){
  const statusEl = $('#nfc_form_status');
  const btnEl = $('#nfc_btn');
  const cedula = ($('#f_cedula')?.value||'').trim();
  if(!cedula){ if(statusEl){ statusEl.textContent='Escribe primero la cédula del colaborador.'; statusEl.style.color='var(--danger)'; } return; }
  if(!('NDEFReader' in window)){
    if(statusEl){ statusEl.textContent='Web NFC no está disponible en este dispositivo o navegador (usa Chrome en Android).'; statusEl.style.color='var(--danger)'; }
    return;
  }
  /* cancela cualquier escritura anterior que siga esperando un tag */
  if(_nfcWriteController){ _nfcWriteController.abort(); _nfcWriteController = null; }
  const controller = new AbortController();
  _nfcWriteController = controller;
  if(btnEl) btnEl.disabled = true;
  try{
    if(statusEl){ statusEl.textContent='Acerca el tag NFC al lector…'; statusEl.style.color='var(--muted)'; }
    const writer = new NDEFReader();
    await writer.write({ records:[{ recordType:'text', data:cedula }] }, { signal: controller.signal });
    if(statusEl){ statusEl.textContent='✓ Tag NFC asignado correctamente a la cédula '+cedula+'.'; statusEl.style.color='var(--success)'; }
    mostrarCheckExito('Tag NFC asignado — '+cedula);
  } catch(err){
    if(err.name==='AbortError'){
      /* esta escritura fue cancelada a propósito por un nuevo intento; no mostramos error */
    } else if(/cancel/i.test(err.message)){
      if(statusEl){ statusEl.textContent='Se canceló la grabación porque el botón se presionó más de una vez. Presiónalo una sola vez y acerca el tag de inmediato.'; statusEl.style.color='var(--danger)'; }
    } else {
      if(statusEl){ statusEl.textContent='No se pudo grabar el tag: '+err.message; statusEl.style.color='var(--danger)'; }
    }
  } finally {
    if(_nfcWriteController===controller) _nfcWriteController = null;
    if(btnEl) btnEl.disabled = false;
  }
}
async function guardarEmpleado(id){
  const data = {
    nombre:$('#f_nombre').value.trim(), cedula:$('#f_cedula').value.trim(), cargo:$('#f_cargo').value.trim(), area:$('#f_area').value.trim(),
    contrato:$('#f_contrato').value, ingreso:$('#f_ingreso').value, salario:Number($('#f_salario').value)||0,
    estado:$('#f_estado').value, email:$('#f_email').value.trim(), tel:$('#f_tel').value.trim(), supervisor:$('#f_super').value.trim(),
  };
  if(!data.nombre || !data.cargo){ toast('Completa al menos nombre y cargo'); return; }
  let saved;
  if(id){ saved = Object.assign(emp(id), data); }
  else{ saved = {id:uid('emp'), huella:false, puntos:0, ...data}; DB.empleados.push(saved); }
  const res = await sbGuardarEmpleado(saved); const ok = res===true;
  if(ok){ toast(id? 'Colaborador actualizado y guardado' : 'Colaborador creado y guardado'); }
  else{ toast('⚠️ El colaborador se guardó localmente, pero falló el guardado en la base de datos: '+res); }
  if(!state.currentEmp) state.currentEmp = saved.id;
  if(!state.objEmp) state.objEmp = saved.id;
  closeModal(); renderApp();
}

/* =========================================================
   3. NÓMINA (+ liquidación detallada descargable)
   ========================================================= */
function calcularDetalle(det, e){
  const valorDia = e.salario/30;
  const valorHora = e.salario/CFG.horasMes;
  const salarioProp = valorDia * det.dias;
  const extraHED = valorHora * det.hed * (1+CFG.rHED/100);
  const extraHEN = valorHora * det.hen * (1+CFG.rHEN/100);
  const extraHEFD = valorHora * det.hefd * (1+CFG.rHEFD/100);
  const extraHEFN = valorHora * det.hefn * (1+CFG.rHEFN/100);
  const auxTr = (e.salario <= CFG.smmlv*2) ? CFG.auxTransporte * (det.dias/30) : 0;
  const devengado = salarioProp + extraHED + extraHEN + extraHEFD + extraHEFN + auxTr + det.bonif + det.otros;
  const salud = salarioProp * CFG.saludPct/100;
  const pension = salarioProp * CFG.pensionPct/100;
  const deducciones = salud + pension + det.otrasDed;
  det.salarioProp=Math.round(salarioProp); det.extraTotal=Math.round(extraHED+extraHEN+extraHEFD+extraHEFN);
  det.auxTr=Math.round(auxTr); det.devengado=Math.round(devengado); det.salud=Math.round(salud); det.pension=Math.round(pension);
  det.deducciones=Math.round(deducciones); det.neto=Math.round(devengado-deducciones);

  /* Prestaciones sociales y aportes patronales — no aplican a contratos
     por prestación de servicios (no generan relación laboral subordinada
     según el CST, art. 34 y ss.) */
  const esIndependiente = e.contrato === 'Prestación de servicios';
  const diasAno = det.dias; // días del período actual, base para la provisión mensual proporcional
  if(esIndependiente){
    det.cesantias=0; det.interesesCesantias=0; det.prima=0; det.vacaciones=0; det.aportesPatronales=0;
  } else {
    const baseCesPrima = salarioProp + auxTr; // el auxilio de transporte sí integra la base de cesantías y prima
    const cesantias = baseCesPrima * diasAno / 360 * (CFG.pctCesantias/8.33); // ajustable si cambia la tasa
    const interesesCesantias = cesantias * diasAno * (CFG.pctIntCesantias/100) / 360;
    const prima = baseCesPrima * diasAno / 360 * (CFG.pctPrima/8.33);
    const vacaciones = salarioProp * diasAno / 720 * (CFG.pctVacaciones/4.17); // las vacaciones no llevan auxilio de transporte
    const factorExon = CFG.exoneracion && (e.salario < CFG.smmlv*10) ? 0 : 1;
    const arl = salarioProp * CFG.pctArl/100;
    const caja = salarioProp * CFG.pctCaja/100;
    const sena = salarioProp * CFG.pctSena/100 * factorExon;
    const icbf = salarioProp * CFG.pctIcbf/100 * factorExon;
    const saludPatronal = salarioProp * CFG.pctSaludPatronal/100 * factorExon;
    const pensionPatronal = salarioProp * CFG.pctPensionPatronal/100;
    const aportesPatronales = arl + caja + sena + icbf + saludPatronal + pensionPatronal;
    det.cesantias=Math.round(cesantias); det.interesesCesantias=Math.round(interesesCesantias);
    det.prima=Math.round(prima); det.vacaciones=Math.round(vacaciones); det.aportesPatronales=Math.round(aportesPatronales);
  }
  det.costoEmpresa = Math.round(devengado + det.cesantias+det.interesesCesantias+det.prima+det.vacaciones+det.aportesPatronales);
  return det;
}

async function actualizarLinea(runId, empId, campo, valor){
  const run = DB.payrollRuns.find(r=>r.id===runId);
  const det = run.detalles.find(d=>d.empId===empId);
  det[campo] = Number(valor)||0;
  calcularDetalle(det, emp(empId));
  $(`#dev-${runId}-${empId}`).textContent = fmtCOP(det.devengado);
  $(`#ded-${runId}-${empId}`).textContent = fmtCOP(det.deducciones);
  $(`#net-${runId}-${empId}`).innerHTML = `<strong>${fmtCOP(det.neto)}</strong>`;
  const res = await sbGuardarNomina(run); const ok = res===true;
  if(!ok) toast('⚠️ Este cambio se guardó localmente, pero falló el guardado en la base de datos.'+' — '+res);
}

async function crearLiquidacion(){
  const periodo = $('#np_periodo').value.trim() || 'Nuevo periodo';
  const fechaPago = $('#np_fecha').value;
  const run = {id:uid('run'), periodo, fechaPago, estado:'Borrador', detalles:[]};
  DB.empleados.filter(e=>e.estado==='Activo').forEach(e=>{
    const det = {empId:e.id, dias:30, hed:0, hen:0, hefd:0, hefn:0, bonif:0, otros:0, otrasDed:0};
    calcularDetalle(det, e);
    run.detalles.push(det);
  });
  DB.payrollRuns.push(run); state.payrollOpenRun = run.id;
  const res = await sbGuardarNomina(run); const ok = res===true;
  closeModal(); toast(ok? 'Liquidación generada' : '⚠️ La liquidación se guardó localmente, pero falló el guardado en la base de datos.'+(ok? '' : ' — '+res)); renderApp();

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=`liquidacion_${e.nombre.replace(/\s+/g,'_')}_${run.periodo.replace(/[^a-z0-9]/gi,'_')}.html`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  toast('Liquidación descargada');
}

function registrarMarcacion(){
  const empId = $('#mk_emp').value, tipo = $('#mk_tipo').value;
  const horaSim = tipo==='Entrada' ? '08:0'+Math.floor(Math.random()*9) : '17:0'+Math.floor(Math.random()*9);
  let rec = DB.attendance.find(a=>a.empId===empId && a.fecha===DEMO_TODAY);
  if(!rec){ rec = {id:uid('att'), empId, fecha:DEMO_TODAY, entrada:null, salida:null, estado:'A tiempo', metodo:'Manual', marcas:[]}; DB.attendance.push(rec); }
  if(!rec.marcas) rec.marcas = marcasDeRegistro(rec);
  rec.marcas.push({hora:horaSim, tipo});
  rec.metodo = 'Manual';
  if(tipo==='Entrada'){
    if(!rec.entrada) rec.entrada=horaSim;
    const numEntrada = rec.marcas.filter(m=>m.tipo==='Entrada').length;
    const evalR = evaluarEntrada(emp(empId), horaSim, numEntrada);
    const esTarde = evalR!==null ? evalR==='Tarde' : (horaSim > '08:05'); // sin horario definido: se usa el umbral por defecto
    if(esTarde) rec.estado = 'Tarde';
  }
  else { rec.salida=horaSim; }
  rec.horasDia = Math.round(horasDeRegistro(rec).horas*100)/100;
  sbRegistrarMarcacion(rec);
  const e = emp(empId); if(e) verificarAlertaHoras(e);
  closeModal(); toast('Marcación registrada'); renderApp();
}
/* ---------------------------------------------------------

function abrirTurno(id){
  const t = id? DB.shifts.find(s=>s.id===id) : null;
  const h = t? (t.horario||{}) : {};
  state.turnoTemp = {
    id: t? t.id : null,
    nombre: t? t.nombre : '',
    dias: t? t.dias : 'Lun–Vie',
    tipo: h.tipo || 'continuo',
    inicio: h.inicio || '08:00',
    fin: h.fin || '17:00',
    bloques: (h.bloques && h.bloques.length)? h.bloques.map(b=>({...b})) : [{inicio:'08:00',fin:'12:00'},{inicio:'14:00',fin:'17:00'}],
    toleranciaMin: h.toleranciaMin!=null? h.toleranciaMin : 5,
  };
  renderModalTurno();
}
function renderModalTurno(){
  const t = state.turnoTemp;
  const horasDia = horasEsperadasHorario(t.tipo==='segmentado'? {tipo:'segmentado', bloques:t.bloques} : {tipo:'continuo', inicio:t.inicio, fin:t.fin});
  const body = `
    <div class="field"><label>Nombre del turno</label><input value="${t.nombre}" oninput="state.turnoTemp.nombre=this.value" placeholder="Ej. Turno tarde"></div>

        <option value="segmentado" ${t.tipo==='segmentado'?'selected':''}>Segmentada (ej. mañana y tarde, con descanso)</option>
      </select>
    </div>
    ${t.tipo==='continuo'? `
    <div class="field-row">
      <div class="field"><label>Hora de entrada</label><input type="time" value="${t.inicio}" onchange="state.turnoTemp.inicio=this.value; renderModalTurno();"></div>
      <div class="field"><label>Hora de salida</label><input type="time" value="${t.fin}" onchange="state.turnoTemp.fin=this.value; renderModalTurno();"></div>
    </div>` : `
    ${t.bloques.map((b,i)=>`
    <div class="field-row" style="align-items:flex-end;">
      <div class="field"><label>${i===0?'Entrada mañana':i===1?'Entrada tarde (tras el descanso)':'Entrada bloque '+(i+1)}</label><input type="time" value="${b.inicio}" onchange="state.turnoTemp.bloques[${i}].inicio=this.value; renderModalTurno();"></div>

  const foot = `<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="guardarTurno()">Guardar turno</button>`;
  openModal(t.id? 'Editar turno' : 'Nuevo turno', body, foot);

function quitarBloqueTurno(i){ state.turnoTemp.bloques.splice(i,1); renderModalTurno(); }
async function guardarTurno(){
  const t = state.turnoTemp;
  const nombre = t.nombre.trim(); if(!nombre){ toast('Escribe un nombre para el turno'); return; }
  const horario = t.tipo==='segmentado'
    ? {tipo:'segmentado', bloques:t.bloques.map(b=>({inicio:b.inicio, fin:b.fin})), toleranciaMin:t.toleranciaMin}
    : {tipo:'continuo', inicio:t.inicio, fin:t.fin, toleranciaMin:t.toleranciaMin};
  let turno;
  if(t.id){ turno = DB.shifts.find(s=>s.id===t.id); Object.assign(turno, {nombre, dias:t.dias, horario}); }
  else { turno = {id:uid('shift'), nombre, dias:t.dias, horario}; DB.shifts.push(turno); }
  const res = await sbGuardarTurno(turno); const ok = res===true;
  state.turnoTemp = null; closeModal();
  toast(ok? 'Turno guardado' : '⚠️ El turno se guardó localmente, pero falló el guardado en la base de datos.'+(ok?'':' — '+res)); renderApp();
}
async function eliminarTurno(id){
  const i = DB.shifts.findIndex(s=>s.id===id); if(i<0) return;
  DB.shifts.splice(i,1);
  /* A los colaboradores que tenían este turno asignado no se les borra su
     ficha — solo se les quita la referencia, para que no quede un turnoId
     "fantasma" apuntando a un turno que ya no existe. */
  const afectados = DB.empleados.filter(e=>e.turnoId===id);
  afectados.forEach(e=> e.turnoId=null);
  await Promise.all(afectados.map(e=>sbGuardarEmpleado(e)));
  const res = await sbBorrarTurno(id); const ok = res===true;
  toast(ok? 'Turno eliminado' : '⚠️ Se eliminó localmente, pero falló el borrado en la base de datos.'+(ok?'':' — '+res)); renderApp();
}

let sigCtx=null, sigDrawing=false, sigHasStroke=false;
function initSigPad(){
  const c = $('#sigCanvas'); if(!c) return;
  sigCtx = c.getContext('2d'); sigCtx.lineWidth=2; sigCtx.lineCap='round'; sigCtx.strokeStyle='#1E3A75'; sigHasStroke=false;
  const pos = ev=>{ const r=c.getBoundingClientRect(); const p = ev.touches? ev.touches[0]:ev;
    return {x:(p.clientX-r.left)*(c.width/r.width), y:(p.clientY-r.top)*(c.height/r.height)}; };
  const start = ev=>{ sigDrawing=true; sigHasStroke=true; const p=pos(ev); sigCtx.beginPath(); sigCtx.moveTo(p.x,p.y); ev.preventDefault(); };
  const move = ev=>{ if(!sigDrawing) return; const p=pos(ev); sigCtx.lineTo(p.x,p.y); sigCtx.stroke(); ev.preventDefault(); };
  const end = ()=>{ sigDrawing=false; };
  c.onmousedown=start; c.onmousemove=move; window.addEventListener('mouseup', end);
  c.ontouchstart=start; c.ontouchmove=move; c.ontouchend=end;
}
function limpiarFirma(){ const c=$('#sigCanvas'); sigCtx.clearRect(0,0,c.width,c.height); sigHasStroke=false; }
async function confirmarFirma(docId){

  openModal('Documento firmado', `

}
async function cambiarPrioridadDenuncia(id, v){
  const c = DB.complaints.find(c=>c.id===id); c.prioridad=v; renderApp();
  const res = await sbGuardarDenuncia(c); const ok = res===true;

function allThreads(){
  return [...DB.comm.gmail.map(t=>({...t,canal:'gmail'})), ...DB.comm.outlook.map(t=>({...t,canal:'outlook'})), ...DB.comm.whatsapp.map(t=>({...t,canal:'whatsapp'}))]
    .sort((a,b)=> new Date(b.fecha)-new Date(a.fecha));
}
function canalLabel(c){ return {gmail:'Gmail', outlook:'Outlook', whatsapp:'WhatsApp'}[c]; }
function renderComunicacion(){
  const threads = state.commTab==='todos'? allThreads() : allThreads().filter(t=>t.canal===state.commTab);
  const activeThread = state.commThreadId ? allThreads().find(t=>t.id===state.commThreadId) : threads[0];
  if(activeThread && !state.commThreadId) state.commThreadId = activeThread.id;
  return `
  <div style="display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap;">
    <span class="acct-chip"><span class="ok"></span>Gmail conectado</span>
    <span class="acct-chip"><span class="ok"></span>Outlook conectado</span>
    <span class="acct-chip"><span class="ok"></span>WhatsApp Business conectado</span>
    <button class="btn btn-ghost btn-sm" onclick="toast('Esto abriría el flujo de conexión de una nueva cuenta.')">+ Conectar canal</button>
  </div>
  <div class="chips">
    ${['todos','gmail','outlook','whatsapp'].map(c=>`<div class="chip ${state.commTab===c?'active':''}" onclick="state.commTab='${c}'; state.commThreadId=null; renderApp();">${c==='todos'?'Todos':canalLabel(c)}</div>`).join('')}
  </div>
  <div class="comm-layout">
    <div class="comm-list">
      ${threads.map(t=>`<div class="comm-item ${activeThread&&activeThread.id===t.id?'active':''}" onclick="abrirHilo('${t.id}')">
        <div class="top"><span class="nm">${t.contacto}${!t.leido?'<span class=\"unread\"></span>':''}</span><span class="ch">${canalLabel(t.canal)}</span></div>
        <div class="snip">${t.asunto}</div>
      </div>`).join('') || emptyState('Sin conversaciones','No hay mensajes en este canal.')}
    </div>
    <div class="comm-thread">
      ${activeThread? `
        <div class="comm-thread-head"><div><strong>${activeThread.contacto}</strong><div style="font-size:11.5px; color:var(--muted);">${activeThread.asunto} · ${canalLabel(activeThread.canal)}</div></div></div>
        <div class="comm-msgs" id="commMsgs">
          ${activeThread.mensajes.map(m=>`<div class="msg ${m.de==='ellos'?'them':'us'}">${m.texto}<span class="hora">${m.hora}</span></div>`).join('')}
        </div>
        <div class="comm-reply"><textarea id="commReply" placeholder="Escribe una respuesta…"></textarea><button class="btn btn-primary" onclick="responderHilo('${activeThread.id}')">Enviar</button></div>
      ` : `<div style="padding:40px;">${emptyState('Sin conversación seleccionada','Elige un mensaje de la lista.')}</div>`}
    </div>
  </div>`;
}
function findThreadById(id){
  for(const canal of ['gmail','outlook','whatsapp']){ const t = DB.comm[canal].find(x=>x.id===id); if(t) return {t,canal}; }
  return null;
}
function abrirHilo(id){ const f=findThreadById(id); if(f) f.t.leido=true; state.commThreadId=id; renderApp(); }
function responderHilo(id){
  const f = findThreadById(id); if(!f) return;
  const txt = $('#commReply').value.trim(); if(!txt) return;
  const hora = new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
  f.t.mensajes.push({de:'nosotros', texto:txt, hora}); f.t.fecha = new Date().toISOString();
  renderApp(); toast('Mensaje enviado');
}
function scrollMsgsToBottom(){ const box=$('#commMsgs'); if(box) box.scrollTop = box.scrollHeight; }

function pillActivo(e){

  if(e==='Asignado') return '<span class="pill pill-blue">Asignado</span>';
  if(e==='Mantenimiento') return '<span class="pill pill-amber">Mantenimiento</span>';
  return '<span class="pill pill-red">Baja</span>';

function abrirActivo(){
  const body = `

    <div class="field-row"><div class="field"><label>Categoría</label><select id="as_cat">${['Tangible','Intangible'].map(o=>`<option>${o}</option>`).join('')}</select></div>

    <div class="field-row"><div class="field"><label>Identificador / serial</label><input id="as_id"></div>

}
async function guardarActivo(){
  const nombre = $('#as_nombre').value.trim(); if(!nombre){ toast('Escribe el nombre del activo'); return; }
  const nuevo = {id:uid('ast'), nombre, categoria:$('#as_cat').value, tipo:$('#as_tipo').value.trim()||'General', identificador:$('#as_id').value.trim()||'—', estado:'Disponible', asignadoA:null, fecha:null, valor:Number($('#as_valor').value)||0};
  DB.assets.push(nuevo);
  const res = await sbGuardarActivo(nuevo); const ok = res===true;
  closeModal(); toast(ok? 'Activo agregado al inventario' : '⚠️ El activo se guardó localmente, pero falló el guardado en la base de datos.'+(ok? '' : ' — '+res)); renderApp();

function asignarActivo(id){

  openModal('Asignar activo', body, foot);

async function confirmarAsignacion(id){
  const a = DB.assets.find(x=>x.id===id); a.estado='Asignado'; a.asignadoA=$('#ax_emp').value; a.fecha=DEMO_TODAY;
  const res = await sbGuardarActivo(a); const ok = res===true;
  closeModal(); toast(ok? 'Activo asignado' : '⚠️ Se asignó localmente, pero falló el guardado en la base de datos.'+(ok? '' : ' — '+res)); renderApp();

async function liberarActivo(id){

}

async function enviarRespuesta(surveyId){
  const s = DB.surveys.find(x=>x.id===surveyId);

  s.preguntas.forEach(p=>{
    if(p.tipo==='clima'){ const checked=document.querySelector(`input[name="rq_${p.id}"]:checked`); valores[p.id]=checked?checked.value:''; }
    else valores[p.id] = $('#rq_'+p.id).value;
  });
  s.respuestas.push({empId:$('#rs_emp').value, fecha:DEMO_TODAY, valores});
  const res = await sbGuardarEncuesta(s); const ok = res===true;

function verResultadosEncuesta(surveyId){
  const s = DB.surveys.find(x=>x.id===surveyId);
  const body = s.preguntas.map(p=>{
    if(p.tipo==='abierta'){
      const respuestas = s.respuestas.map(r=>r.valores[p.id]).filter(Boolean);
      return `<div style="margin-bottom:16px;"><h4 style="font-size:13px; margin-bottom:8px;">${p.texto}</h4>
        ${respuestas.length? respuestas.map(t=>`<p style="font-size:12.5px; border-left:2px solid var(--line); padding-left:9px; margin-bottom:6px;">${t}</p>`).join('') : '<p style="font-size:12.5px; color:var(--muted);">Sin respuestas aún.</p>'}</div>`;
    }
    const opciones = p.tipo==='clima'? CLIMA_OPCIONES.map(o=>o[0]) : p.opciones;
    const counts = opciones.map(o=> s.respuestas.filter(r=>r.valores[p.id]===o).length);
    const max = Math.max(1,...counts);
    return `<div style="margin-bottom:16px;"><h4 style="font-size:13px; margin-bottom:8px;">${p.texto}</h4>
      ${opciones.map((o,i)=>`<div class="bar-row"><div class="bl"><span>${o}</span><span>${counts[i]}</span></div><div class="bar-track"><div class="bar-fill" style="width:${counts[i]/max*100}%;"></div></div></div>`).join('')}
    </div>`;
  }).join('');
  openModal(`Resultados — ${s.titulo}`, body || emptyState('Sin datos','Esta encuesta todavía no tiene preguntas.'), `<button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>`, true);
}

        <button class="btn btn-primary" onclick="solicitarAdelanto('${you.id}')" ${disponible<=0?'disabled':''}>Retirar ahora</button>
      </div>
    </div>
    <h3 style="font-size:13px; margin-bottom:10px;">Historial de retiros</h3>
    <div class="table-wrap"><table><thead><tr><th>Fecha de solicitud</th><th class="num-cell">Monto</th><th>Estado</th></tr></thead><tbody>
      ${historial.map(a=>`<tr><td>${fmtDate(a.fecha)}</td><td class="num-cell">${fmtCOP(a.monto)}</td><td><span class="pill pill-green">${a.estado}</span></td></tr>`).join('')}
      ${!historial.length? `<tr><td colspan="3">${emptyState('Sin retiros','Este colaborador aún no ha solicitado adelantos.')}</td></tr>`:''}
    </tbody></table></div>
  </div>`;
}
async function solicitarAdelanto(empId){
  const monto = Number($('#ad_monto').value)||0;
  const disponible = disponibleAdelanto(empId);
  if(monto<=0){ toast('Ingresa un monto válido'); return; }
  if(monto>disponible){ toast('El monto supera lo disponible para retirar'); return; }
  const nuevo = {id:uid('adv'), empId, fecha:DEMO_TODAY, monto, estado:'Pagado'};
  DB.advances.push(nuevo);
  const res = await sbGuardarAdelanto(nuevo); const ok = res===true;
  toast(ok? 'Adelanto pagado correctamente' : '⚠️ El adelanto se guardó localmente, pero falló el guardado en la base de datos.'+(ok? '' : ' — '+res)); renderApp();
}

const PLANTILLAS = ['Nómina','Colaboradores','Asistencia','Vacaciones','Firma de documentos','Beneficios','Reconocimientos','Objetivos','Activos','Encuestas','Denuncias'];
function renderReportes(){
  return `
